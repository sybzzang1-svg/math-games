<style>
:root{
  --paper:#173A6B; --paper-deep:#10294D; --paper-hi:#1F4A82;
  --chalk:#EEF3FA; --chalk-dim:#A9BCD6; --line:rgba(238,243,250,.22);
  --amber:#F3B741; --mint:#72D8B4; --coral:#F07B6B;
  --r-sm:6px; --r-md:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--chalk); background:var(--paper-deep);
  background-image:
    linear-gradient(var(--grid,rgba(255,255,255,.05)) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid,rgba(255,255,255,.05)) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;

  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
#app{max-width:880px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.15}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
h3{font-size:1.05rem;font-weight:700}
p{max-width:62ch}
.dim{color:var(--chalk-dim)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---- 도면 틀: 굵은 외곽선 + 안쪽 가는 선 (청사진 도면의 표제란 느낌) ---- */
.sheet{border:2px solid var(--chalk);border-radius:var(--r-sm);padding:4px;margin:16px 0}
.sheet>.in{border:1px solid var(--line);border-radius:3px;padding:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--chalk);
  background:transparent;border-radius:var(--r-sm);padding:12px 18px;font-weight:700;min-height:48px}
.btn:hover{background:rgba(238,243,250,.08)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#2A1B00}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}

label.f{display:block;font-size:.88rem;color:var(--chalk-dim);margin-bottom:6px}
input.t,select.t{width:100%;background:rgba(0,0,0,.18);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;font-size:1.05rem;min-height:48px}
input.t:focus{border-color:var(--chalk)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;border:1.5px solid var(--line);background:transparent;border-radius:var(--r-sm);padding:10px;font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--amber);background:rgba(243,183,65,.14);color:var(--amber)}

.banner{border:1.5px dashed var(--amber);color:var(--amber);border-radius:var(--r-sm);padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.err{color:var(--coral);font-size:.9rem;min-height:1.4em}

/* ---- 첫 화면 ---- */
.hero{padding:28px 4px 8px}
.hero .dim{margin-top:10px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.choose .btn{min-height:88px;flex-direction:column;font-size:1.1rem}
.choose .btn span{font-weight:400;font-size:.84rem;color:var(--chalk-dim)}
@media (max-width:520px){.choose{grid-template-columns:1fr}}

/* ---- 학생 플레이 ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px 12px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--chalk-dim)}
.dots i.done{background:var(--mint);border-color:var(--mint)}
.dots i.now{border-color:var(--amber);background:rgba(243,183,65,.3)}
.story{margin:16px 0 4px;color:var(--chalk-dim)}
.roomtitle{margin-top:14px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
/* 단서 카드 = 찢어낸 도면 조각. 이 게임에서 유일하게 힘을 준 요소 */
.clue{position:relative;background:var(--paper-hi);border-radius:4px;padding:16px 16px 18px;
  border:1.5px solid var(--chalk-dim);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),94% 100%,86% calc(100% - 7px),76% 100%,64% calc(100% - 8px),52% 100%,40% calc(100% - 6px),28% 100%,16% calc(100% - 8px),6% 100%,0 calc(100% - 9px))}
.clue .tag{font-size:.78rem;color:var(--amber);font-weight:600;margin-bottom:6px}
.clue .body{font-size:1.12rem;font-weight:600;line-height:1.5}
.clue svg{display:block;width:100%;max-width:300px;height:auto;margin:8px auto 2px}
.fig text{fill:var(--chalk);font-family:inherit;font-weight:700}
.fig .ln{stroke:var(--chalk);stroke-width:2.2;fill:none}
.fig .hl{stroke:var(--amber);stroke-width:3.4;fill:none}
.fig .aux{stroke:var(--chalk-dim);stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.fig .dot{fill:var(--chalk)}

.mates{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.mates span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.84rem;color:var(--chalk-dim)}
.mates span.me{border-color:var(--amber);color:var(--amber)}

.lock{border:2px solid var(--chalk);border-radius:var(--r-sm);padding:4px;margin-top:18px}
.lock>.in{border:1px solid var(--line);border-radius:3px;padding:16px}
.lock .q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.lock .ans{display:flex;gap:10px}
.lock .ans input{flex:1;font-size:1.3rem;text-align:center}
.hint{border-left:4px solid var(--mint);background:rgba(114,216,180,.1);padding:10px 12px;margin-top:12px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.95rem}
.lockmsg{color:var(--coral);font-weight:700;margin-top:10px}

/* 문이 열리는 순간 — 게임 전체에서 단 하나의 연출 */
.unlock{position:fixed;inset:0;background:rgba(16,41,77,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;z-index:50}
.unlock .ring{width:120px;height:120px;border-radius:50%;border:6px solid var(--mint);display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;color:var(--mint);animation:pop .5s ease-out}
.unlock h2{margin-top:18px}
.unlock p{margin-top:10px;color:var(--chalk-dim)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.unlock .ring{animation:none}}

.overlay{position:fixed;inset:0;background:rgba(16,41,77,.9);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:40}

.explain{border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:14px;font-size:.92rem;color:var(--chalk-dim)}
.explain b{color:var(--chalk)}

/* ---- 교사 관제실 ---- */
.dash-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.code{font-size:3.2rem;font-weight:700;letter-spacing:.12em;line-height:1}
.qr{background:#fff;padding:8px;border-radius:var(--r-sm);width:132px;height:132px}
.qr img,.qr canvas{width:116px!important;height:116px!important}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.gcard{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px}
.gcard.escaped{border-color:var(--mint)}
.gcard .gt{display:flex;justify-content:space-between;align-items:baseline}
.gcard .where{font-size:1.2rem;font-weight:700;margin:6px 0}
.gcard .who{font-size:.84rem;color:var(--chalk-dim);min-height:1.3em}
.gcard .meta{font-size:.84rem;color:var(--chalk-dim);margin-top:6px}
.gcard .hb{display:flex;gap:6px;margin-top:10px}
.gcard .hb button{flex:1;border:1.5px solid var(--mint);color:var(--mint);background:transparent;border-radius:var(--r-sm);padding:8px 4px;font-size:.84rem;font-weight:700}
.gcard .hb button:disabled{opacity:.35;cursor:default}
.rank{list-style:none;counter-reset:r}
.rank li{counter-increment:r;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li::before{content:counter(r) "위";color:var(--amber);font-weight:700;width:3em}
.rank li span:first-child{flex:1}
@media (max-width:560px){.dash-head{grid-template-columns:1fr}.code{font-size:2.6rem}}
/* ---- 글자 모으기 ---- */
.lbar{display:flex;align-items:center;gap:6px;margin-top:10px}
.lbar i{width:32px;height:32px;border:1.5px dashed var(--chalk-dim);border-radius:4px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:1.05rem}
.lbar i.got{border:1.5px solid var(--amber);color:var(--amber);background:rgba(243,183,65,.12)}
.lbar span{margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tile{border:1.5px solid var(--amber);border-radius:6px;padding:10px 4px;text-align:center;background:rgba(0,0,0,.12)}
.tile b{display:block;font-size:2.2rem;color:var(--amber);line-height:1.1}
.tile span{font-size:.74rem;color:var(--chalk-dim);line-height:1.3}
.unlock .got{font-size:1.1rem;color:var(--chalk);margin-top:14px;display:flex;align-items:center;gap:10px}
.unlock .got b{font-size:2.4rem;color:var(--amber);border:2px solid var(--amber);border-radius:6px;padding:0 14px;line-height:1.3}
/* ---- 개인전 관제실 ---- */
.dist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.dcol{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.dcol.done{border-color:var(--mint)}
.dn{font-size:1.8rem;font-weight:700;line-height:1.1}.dn span{font-size:.9rem;font-weight:400;color:var(--chalk-dim);margin-left:2px}
.dl{font-size:.84rem;color:var(--chalk-dim);margin-top:2px}
.dh{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.dh button,.ph button{border:1.5px solid var(--mint);color:var(--mint);background:transparent;border-radius:var(--r-sm);font-weight:700;font-size:.8rem;padding:6px 4px}
.dh button:disabled,.ph button:disabled{opacity:.3;cursor:default}
.tw{overflow-x:auto;margin-top:8px}
.ptable{width:100%;border-collapse:collapse;font-size:.92rem}
.ptable th{text-align:left;font-weight:600;color:var(--chalk-dim);font-size:.8rem;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable tr.esc td:first-child{color:var(--mint);font-weight:700}
.dots.sm i{width:10px;height:10px}
.ph{display:inline-flex;gap:4px}.ph button{width:30px}
@media (max-width:560px){.dist{grid-template-columns:repeat(3,1fr)}}
</style>

<script>
/* ============================================================
   1. 문제 데이터 — 유치원 (한 자리 수 덧셈·뺄셈, 구구단 2단)
   정답은 계산으로 확인했습니다.
   R1 7 / R2 6 / R3 10 / R4 14 / 보물상자 참잘했어 / 도전 13
   ============================================================ */
const F = {};

const STAGES = [
  { title:'첫 번째 문 · 햇살반 교실', scene:'sun',
    story:'선생님이 잠깐 나간 사이 교실 문이 잠겼어요! 곰돌이가 사과 바구니 옆에 쪽지를 남겼대요.',
    q:'사과는 모두 몇 개일까요?', unit:'개', ans:{n:7}, letter:'잘',
    cards:[
      {tag:'첫 번째 바구니', body:'<span class="emo">🍎🍎🍎</span>'},
      {tag:'두 번째 바구니', body:'<span class="emo">🍎🍎🍎🍎</span>'},
      {tag:'곰돌이 쪽지', body:'두 바구니의 사과를 하나씩 모두 세어 봐요!'}],
    hints:['첫 번째 바구니는 3개, 두 번째 바구니는 4개예요.',
           '3 + 4 = ? 손가락 3개를 펴고, 4개를 더 펴 보세요.'],
    explain:'<b>풀이</b> 3 + 4 = 7. 사과는 모두 7개!' },

  { title:'두 번째 문 · 놀이터', scene:'play',
    story:'놀이터로 나가는 문이 잠겨 있어요. 미끄럼틀에 풍선이 묶여 있었는데, 바람이 휘잉 불었어요!',
    q:'남은 풍선은 몇 개일까요?', unit:'개', ans:{n:6}, letter:'참',
    cards:[
      {tag:'처음 풍선', body:'<span class="emo">🎈🎈🎈🎈🎈🎈🎈🎈🎈</span>'},
      {tag:'날아간 풍선', body:'<span class="emo">🎈🎈🎈 💨</span>'},
      {tag:'곰돌이 쪽지', body:'처음 풍선에서 날아간 풍선만큼 빼 봐요.'}],

   2. 저장소 — Firebase 또는 로컬(같은 브라우저 탭끼리)
   ============================================================ */
function makeLocalStore(key){
  const KEY=key||('escape_local_db_'+GAME_ID);
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const write=(o)=>{localStorage.setItem(KEY,JSON.stringify(o));fire()};
  const get=(o,p)=>p.split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k],o);
  const put=(o,p,v)=>{const ks=p.split('/').filter(Boolean);let c=o;ks.slice(0,-1).forEach(k=>{if(typeof c[k]!=='object'||c[k]===null)c[k]={};c=c[k]});
    if(v===null||v===undefined)delete c[ks[ks.length-1]];else c[ks[ks.length-1]]=v};
  const subs=new Set();
  function fire(){const d=read();subs.forEach(s=>{const v=get(d,s.p);const j=JSON.stringify(v);if(j!==s.last){s.last=j;s.cb(v===undefined?null:JSON.parse(j))}})}
  window.addEventListener('storage',e=>{if(e.key===KEY)fire()});
  return {
    local:true, now:()=>Date.now(),
    on(p,cb){const s={p,cb,last:undefined};subs.add(s);const v=get(read(),p);s.last=JSON.stringify(v);cb(v===undefined?null:v);return()=>subs.delete(s)},
    async once(p){const v=get(read(),p);return v===undefined?null:v},
    async set(p,v){const d=read();put(d,p,v);write(d)},
    async update(p,obj){const d=read();Object.entries(obj).forEach(([k,v])=>put(d,p+'/'+k,v));write(d)},
    async tx(p,fn){const d=read();const cur=get(d,p);const nx=fn(cur===undefined?null:JSON.parse(JSON.stringify(cur)));if(nx===undefined)return false;put(d,p,nx);write(d);return true},
    presence(){}
  };
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function makeFirebaseStore(cfg){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  firebase.initializeApp(cfg);
  const db=firebase.database(); let offset=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0});
  return {
    local:false, now:()=>Date.now()+offset,
    on(p,cb){const r=db.ref(p);const h=r.on('value',s=>cb(s.val()));return()=>r.off('value',h)},
    async once(p){return (await db.ref(p).once('value')).val()},
    set:(p,v)=>db.ref(p).set(v),
    update:(p,o)=>db.ref(p).update(o),
    async tx(p,fn){const r=await db.ref(p).transaction(c=>{const n=fn(c);return n});return r.committed},
    presence(p){const r=db.ref(p);db.ref('.info/connected').on('value',s=>{if(s.val()){r.onDisconnect().update({online:false});r.update({online:true})}})}
  };
}

/* ---- 효과음: 모두 합성. 첫 터치 뒤에만 소리가 납니다(브라우저 규칙) ---- */
const SND=(()=>{
  let ctx=null, master=null, amb=null, ambNodes=[], NB=null, started=false;
  let on=true; try{on=localStorage.getItem('horror_snd')!=='off'}catch(e){}
  function init(){
    if(ctx)return true;
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=on?0.8:0;master.connect(ctx.destination);return true}
    catch(e){return false}
  }
  function nbuf(){if(NB)return NB;NB=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB}
  function noise(dur,f,q,g,t){const s=ctx.createBufferSource();s.buffer=nbuf();const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
    const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+Math.min(.05,dur/3));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp);bp.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+.05)}
  function tone(f,dur,type,g,t,glide){const o=ctx.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
    const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05)}
  function ambient(){   // 낮게 웅웅거리는 건물 소리 + 창틈 바람
    const t=ctx.currentTime, g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+3);g.connect(master);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lp.connect(g);
    ambNodes=[];[55,55.7,82.4].forEach(f=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();ambNodes.push(o)});
    const s=ctx.createBufferSource();s.buffer=nbuf();s.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.7;
    const wg=ctx.createGain();wg.gain.value=.22;s.connect(bp);bp.connect(wg);wg.connect(g);s.start();ambNodes.push(s);
    const lfo=ctx.createOscillator();lfo.frequency.value=.07;const lg=ctx.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();ambNodes.push(lfo);
    amb=g}
  const ok=()=>ctx&&on;
  return {
    get on(){return on},
    start(){if(!init())return;if(ctx.state==='suspended')ctx.resume().catch(()=>{});if(!started){started=true/* 유치원판: 배경 소리 없음 */}},
    toggle(){on=!on;try{localStorage.setItem('horror_snd',on?'on':'off')}catch(e){}if(!init())return;this.start();master.gain.setTargetAtTime(on?0.8:0,ctx.currentTime,.05)},
    creak(){if(!ok())return;const t=ctx.currentTime;[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.35,'triangle',.14,t+i*.09));tone(1046.5,.9,'sine',.1,t+.4)},   // 짜잔!
    chime(){if(!ok())return;const t=ctx.currentTime+.6;[784,659.3,523.3].forEach((f,i)=>tone(f,.6,'sine',.14,t+i*.22))},   // 딩동댕
    tap(){if(!ok())return;tone(880,.08,'sine',.08,ctx.currentTime)},
    sting(){if(!ok())return;const t=ctx.currentTime;tone(392,.3,'triangle',.16,t,330);tone(330,.3,'triangle',.16,t+.3,277);tone(277,.6,'triangle',.16,t+.6,196)},   // 뿌우웅~ (아이용 오답 소리)
    beat(){if(!ok())return;const t=ctx.currentTime;tone(62,.18,'sine',.5,t,40);tone(56,.18,'sine',.35,t+.22,38)},
    whisper(){if(!ok())return;const t=ctx.currentTime;for(let i=0;i<5;i++)noise(.25+Math.random()*.2,1200+Math.random()*2500,6,.05,t+i*.18)},
    steps(){if(!ok())return;const t=ctx.currentTime;for(let i=0;i<4;i++){noise(.12,180,1.2,.4,t+i*.55);tone(70,.12,'sine',.25,t+i*.55)}},
    escape(){if(!ok())return;const t=ctx.currentTime;if(amb)amb.gain.setTargetAtTime(0,t,.5);[261.6,329.6,392,523.3].forEach((f,i)=>tone(f,2.2,'triangle',.1,t+i*.15))},
    stopAmb(){if(!ctx||!amb)return;amb.gain.setTargetAtTime(0,ctx.currentTime,.3);const ns=ambNodes;amb=null;ambNodes=[];started=false;
      setTimeout(()=>ns.forEach(n=>{try{n.stop()}catch(e){}}),1200)}
  };
})();

/* ---- 화면 효과: 붉은 번쩍임, 흔들림, 정전 깜빡임. '동작 줄이기' 설정이면 끔 ---- */
const FX=(()=>{
  let scareT=null, beatT=null;
  const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function flash(){const f=$('#fx-flash');if(!f)return;f.classList.add('on');setTimeout(()=>f.classList.remove('on'),170)}
  function shake(){if(reduce())return;const b=document.body;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500)}
  function blackout(){if(reduce())return;const b=document.body;b.classList.add('blackout');setTimeout(()=>b.classList.remove('blackout'),120);
    setTimeout(()=>{b.classList.add('blackout');setTimeout(()=>b.classList.remove('blackout'),70)},230)}
  function loop(){clearTimeout(scareT);scareT=setTimeout(()=>{const r=Math.random();
    if(r<.4){SND.whisper()}else if(r<.75)SND.steps();else SND.whisper();loop()},25000+Math.random()*25000)}
  return {
    enter(){},   // 발소리·속삭임 없음
    leave(){clearTimeout(scareT);clearInterval(beatT);beatT=null;SND.stopAmb();document.body.classList.remove('dawn','shake','blackout')},
    wrong(ms){shake();SND.sting()},   // 심장 박동 없음
    unlock(){clearInterval(beatT);beatT=null;SND.creak();SND.chime()},
    escape(){clearTimeout(scareT);document.body.classList.add('dawn');SND.escape()}
  };
})();

/* 필름 잡음: 작은 무늬를 한 번만 만들어 배경으로 깔고 CSS로 흔듦 (휴대폰 부담이 적음) */
(function grain(){try{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const im=x.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  x.putImageData(im,0,0);const g=document.getElementById('fx-grain');if(g)g.style.backgroundImage='url('+c.toDataURL()+')'}catch(e){}})();

/* ============================================================
   8. 학생 — 플레이  (단서 5장을 모두 봄)
   ============================================================ */
function viewPlay(code,pid){
  clearView();
  let room=null, lastStage=null, showBonus=false, lastWrong=null;
  const P='rooms/'+code+'/players/'+pid;
  FX.enter(); document.addEventListener('pointerdown',()=>SND.start(),{once:true});
  S.presence(P);
  function unlockFx(stageIdx){
    const s=STAGES[stageIdx];
    layer.innerHTML=`<div class="unlock" role="status"><div class="ring">✓</div><h2>${s.bonus?'도전 성공!':s.vault?'보물상자가 열렸어요!':'문이 열렸어요!'}</h2>${s.letter?`<p class="got">글자를 찾았어요<b>${s.letter}</b></p>`:''}<p>${s.explain}</p></div>`;
    FX.unlock();
    setTimeout(()=>{layer.innerHTML=''},s.letter||s.vault?4200:3200);
  }
  function render(){
    if(!room)return;
    const m=room.meta, me=(room.players||{})[pid];
    if(!me){app.innerHTML='<p>입장 정보가 없습니다.</p>';return}
    const now=S.now(), stage=me.stage||0, total=Object.keys(room.players||{}).length;
    if(m.state==='lobby'){
      app.innerHTML=`${modeBanner()}<div class="hero"><div class="dim">${esc(m.name)}</div>
        <h1 style="margin-top:6px">잠시 기다리세요</h1><p class="dim">선생님이 시작하면 모험이 시작돼요!</p>
        <div class="sheet"><div class="in"><h3>${esc(me.name)}</h3><p class="dim small" style="margin-top:6px">지금 ${total}명이 들어와 있습니다. 문 네 개를 열어 글자를 모으고, 마지막 금고까지 가장 먼저 여는 사람이 1등입니다.</p></div></div></div>`;
      return;
    }
    if(m.state==='ended'){
      app.innerHTML=`<div class="hero"><h1>활동이 끝났습니다</h1><p class="dim" style="margin-top:10px">${me.escaped!=null?esc(me.name)+' 학생은 '+fmt(me.escaped)+' 만에 탈출했습니다.':'마지막으로 도착한 곳: '+(stage>=DOORS?'마지막 금고':(stage+1)+'번째 문')}</p></div>`;
      return;
    }
    if(stage>=MAIN&&(!showBonus||stage>MAIN)){
      const rk=Object.entries(room.players||{}).filter(([,x])=>x.escaped!=null).sort((a,b)=>a[1].escaped-b[1].escaped).findIndex(([id])=>id===pid)+1;
      const bonusDone=stage>MAIN;
      app.innerHTML=`<div class="hero"><div class="dim">${esc(me.name)}</div><h1 style="margin-top:6px">탈출 성공</h1>
        <p class="dim" style="margin-top:8px">정문이 활짝 열렸어요! 밖에서 친구들이 기다리고 있어요.</p>
        <p class="num" style="font-size:2rem;font-weight:700;margin-top:10px">${fmt(me.escaped)}</p>
        <p class="dim">${total}명 중 ${rk}번째로 탈출했습니다.</p>
        ${bonusDone?'<p style="margin-top:14px;color:var(--mint);font-weight:700">도전 방까지 해결했습니다.</p>':
          `<button class="btn primary" style="margin-top:20px" id="bn">도전 방 들어가기</button>`}</div>`;
      const bn=$('#bn');if(bn)bn.onclick=()=>{showBonus=true;render()};
      return;
    }
    const cur=Math.min(stage,STAGES.length-1), s=STAGES[cur];
    const locked=me.lockUntil&&me.lockUntil>now;
    const hintLv=Math.max((me.hints||{})[cur]||0, s.bonus?0:((m.hints||{})[cur]||0));
    const prev=cur>0&&!s.bonus?STAGES[cur-1]:null;
    app.innerHTML=`${modeBanner()}
    <div class="topbar">
      <span><b>${esc(me.name)}</b></span>
      <span class="dots" aria-label="진행">${Array.from({length:MAIN},(_,i)=>`<i class="${i<stage?'done':i===stage?'now':''}"></i>`).join('')}</span>
      <span class="row" style="gap:8px"><button class="snd" id="snd" aria-label="소리 켜기/끄기">${SND.on?'🔊':'🔇'}</button><span class="num" id="clock">${fmt(elapsedOf(m,now))}</span></span>
    </div>
    ${s.bonus?'':lettersBar(stage)}
    ${s.scene?`<div class="scene" aria-hidden="true">${SCENES[s.scene]}</div>`:''}
    <h2 class="roomtitle">${s.title}</h2>
    <p class="story">${s.story}</p>
    <div class="cards">${s.vault?vaultCards(stage):s.cards.map(c=>`<div class="clue"><div class="tag">${c.tag}</div><div class="body">${c.body}</div>${c.fig?F[c.fig]:''}</div>`).join('')}</div>
    <div class="lock"><div class="in">
      <div class="q">${s.q}</div>
      ${s.cond?`<label class="f">${s.condLabel}</label><div class="seg" id="cond" style="margin-bottom:12px">${s.condOpts.map(x=>`<button data-c="${x}" aria-pressed="false">${x}</button>`).join('')}</div><label class="f" for="an">${s.numLabel}</label>`:''}
      <div class="ans"><input class="t kidshow" id="an" inputmode="none" autocomplete="off" placeholder="${s.vault?'□□□□':'?'}" ${locked||m.state!=='running'?'disabled':''}>
      <button class="btn primary" id="ok" ${locked||m.state!=='running'?'disabled':''}>열기</button></div>
      ${s.vault?`<div class="pad one"><button data-k="clr">처음부터 다시 누르기</button></div>`:`<div class="pad">${[1,2,3,4,5,6,7,8,9,'clr',0,'del'].map(k=>`<button data-k="${k}" aria-label="${k==='clr'?'모두 지우기':k==='del'?'하나 지우기':k}">${k==='clr'?'지우기':k==='del'?'⌫':k}</button>`).join('')}</div>`}
      <div class="lockmsg" id="lm">${locked?'앗, 다시 생각해 봐요! <span class="num" id="lt"></span>초만 기다려요.':''}</div>
      ${hintLv>=1?`<div class="hint"><b>힌트 1</b> ${s.hints[0]}</div>`:''}
      ${hintLv>=2?`<div class="hint"><b>힌트 2</b> ${s.hints[1]}</div>`:''}
      ${PRACTICE?`<div class="row" style="margin-top:12px;align-items:stretch">${hintLv<2?`<button class="btn" id="selfHint">힌트 ${hintLv+1} 보기</button>`:''}<details class="explain" style="flex:1;margin:0"><summary>정답 확인 (테스트용)</summary><b>${s.vault?s.word:(s.ans.cond?s.ans.cond+', ':'')+s.ans.n+(s.unit||'')}</b></details></div>`:''}
    </div></div>
    ${prev?`<div class="explain">앞 문 ${prev.explain}</div>`:''}`;
    if(m.state==='paused')layer.innerHTML=`<div class="overlay"><div><h2>잠시 멈춤</h2><p class="dim" style="margin-top:8px">선생님 설명을 들어 주세요.</p></div></div>`;
    else if(!layer.querySelector('.unlock'))layer.innerHTML='';
    let cond=null;
    app.querySelectorAll('#cond [data-c]').forEach(b=>b.onclick=()=>{cond=b.dataset.c;app.querySelectorAll('#cond [data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    const submit=async()=>{
      const raw=$('#an').value, v=parseNum(raw);
      if(s.vault){if(!raw.trim()){$('#lm').textContent='글자를 입력하세요.';return}}
      else if(isNaN(v)){$('#lm').textContent='숫자를 입력하세요.';return}
      if(s.cond&&!cond){$('#lm').textContent=s.condLabel+'을 먼저 고르세요.';return}
      const right=s.vault?raw.replace(/\s/g,'')===s.word:(Math.abs(v-s.ans.n)<1e-9&&(!s.cond||cond===s.ans.cond));
      const t=S.now(), el=elapsedOf(room.meta,t);
      await S.tx(P,c=>{
        if(!c)return undefined;
        if((c.stage||0)!==cur)return undefined;
        if(c.lockUntil&&c.lockUntil>t)return undefined;
        if(right){c.stage=cur+1;c.solved=c.solved||{};c.solved[cur]=el;if(cur===MAIN-1)c.escaped=el}
        else{c.wrong=(c.wrong||0)+1;c.lockUntil=t+(PRACTICE?3000:LOCK_MS)}
        return c;
      });
    };
    const ok=$('#ok');if(ok)ok.onclick=submit;
    const an=$('#an');if(an)an.onkeydown=e=>{if(e.key==='Enter')submit()};
    const sh=$('#selfHint');if(sh)sh.onclick=()=>S.set(P+'/hints/'+cur,hintLv+1);
    const sb=$('#snd');if(sb)sb.onclick=e=>{e.stopPropagation();SND.toggle();sb.textContent=SND.on?'🔊':'🔇'};
    app.querySelectorAll('.pad [data-k]').forEach(b=>b.onclick=()=>{const a=$('#an');if(!a||a.disabled)return;const k=b.dataset.k;
      if(k==='clr')a.value='';else if(k==='del')a.value=a.value.slice(0,-1);else if(a.value.length<3)a.value+=k;SND.tap()});
    if(s.vault)app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const a=$('#an');if(!a||a.disabled)return;const L=t.querySelector('b').textContent;
      if(L!=='?'&&a.value.length<4){a.value+=L;SND.tap()}});
  }
  unsubs.push(S.on('rooms/'+code,v=>{
    room=v; if(!v){app.innerHTML='<p>수업이 사라졌습니다.</p>';return}
    const me_=((v.players||{})[pid])||{}, st=me_.stage||0, wr=me_.wrong||0;
    if(lastWrong!==null&&wr>lastWrong)FX.wrong(PRACTICE?3000:LOCK_MS);
    lastWrong=wr;
    if(lastStage!==null&&st>lastStage)unlockFx(lastStage);
    if(lastStage!==null&&lastStage<MAIN&&st>=MAIN)FX.escape();
    lastStage=st; render();
  }));
  ticker=setInterval(()=>{
    if(!room)return;
    const c=$('#clock');if(c)c.textContent=fmt(elapsedOf(room.meta,S.now()));
    const me=(room.players||{})[pid];const lt=$('#lt');
    if(me&&me.lockUntil){const left=Math.ceil((me.lockUntil-S.now())/1000);if(lt&&left>0)lt.textContent=left;else if(left<=0&&$('#ok')&&$('#ok').disabled&&room.meta.state==='running')render()}
  },300);
}

/* ============================================================
   8-1. 테스트 모드 — 관제실 없이 학생 화면을 혼자 점검
   수업 서버(Firebase)에는 아무것도 쓰지 않습니다.
   ============================================================ */
function lettersBar(stage){
  return `<div class="lbar" aria-label="모은 글자">${STAGES.slice(0,DOORS).map((d,i)=>`<i class="${stage>i?'got':''}">${stage>i?d.letter:''}</i>`).join('')}<span class="small dim">모은 글자</span></div>`;
}
function vaultCards(stage){
  const tiles=STAGES.slice(0,DOORS).map((d,i)=>`<div class="tile"><b>${stage>i?d.letter:'?'}</b><span>${i+1}번째 문<br>숫자 <strong style="font-size:1.4rem;color:#2B7BC9">${d.ans.n}</strong></span></div>`).join('');
  return `<div class="clue"><div class="tag">모은 글자 (눌러서 암호 만들기)</div><div class="tiles">${tiles}</div></div>`+
         `<div class="clue"><div class="tag">곰돌이의 마지막 쪽지</div><div class="body">${STAGES[DOORS].clue}</div></div>`;
}
const PRACTICE_PW='7abc5c2e49190f6b9e1a9c6248dc6e482be784f62a73d05cc8d4641350553db2';   // 테스트 비밀번호의 지문 (원문은 코드에 없음)
function viewPracticeGate(){
  clearView();
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>테스트 모드</h2><button class="btn" id="back">처음으로</button></div>
  <div class="sheet"><div class="in stack">
    <p class="dim">교사용 점검 화면입니다. 관제실 없이 학생 화면을 혼자 풀어 볼 수 있고, 기록은 남지 않습니다.</p>
    <div><label class="f" for="tp">테스트 비밀번호</label><input class="t num" id="tp" type="password" inputmode="numeric" maxlength="10"></div>
    <div class="err" id="er"></div>
    <button class="btn primary block" id="go">테스트 시작</button>
  </div></div>`;
  $('#back').onclick=viewHome;
  const go=async()=>{if(await hash($('#tp').value)===PRACTICE_PW)startPractice();else{$('#er').textContent='비밀번호가 맞지 않습니다.';$('#tp').value='';$('#tp').focus()}};
  $('#go').onclick=go;$('#tp').onkeydown=e=>{if(e.key==='Enter')go()};$('#tp').focus();
}
let PRACTICE=false, S_MAIN=null;
async function startPractice(){
  clearView();
  S_MAIN=S; PRACTICE=true;
  const key='escape_practice_'+GAME_ID;
  localStorage.removeItem(key);
  S=makeLocalStore(key);
  const code='0000', pid='tester';
  await S.set('rooms/'+code,{meta:{name:'테스트 모드',game:GAME_ID,mode:'solo',state:'running',startedAt:S.now(),pausedTotal:0},
    players:{[pid]:{name:'테스트',joinedAt:S.now(),online:true,stage:0,wrong:0}}});
  viewPlay(code,pid);
}
function exitPractice(){
  clearView(); PRACTICE=false;
  localStorage.removeItem('escape_practice_'+GAME_ID);
  if(S_MAIN)S=S_MAIN;
  viewHome();
}

/* ============================================================
   9. 시작
   ============================================================ */
(async()=>{
  try{ S=FIREBASE_CONFIG?await makeFirebaseStore(FIREBASE_CONFIG):makeLocalStore(); }
  catch(e){ app.innerHTML='<div class="banner">Firebase에 연결하지 못했습니다. 인터넷 연결과 설정값을 확인하세요. 로컬 테스트 모드로 전환합니다.</div>'; S=makeLocalStore(); }
  viewHome();
})();
</script>
