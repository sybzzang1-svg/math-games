<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하늘빛 폐교 탈출 · 초등 셈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=East+Sea+Dokdo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/escape.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="fx-grain" aria-hidden="true"></div><div id="fx-vig" aria-hidden="true"></div><div id="fx-flash" aria-hidden="true"></div>
<div id="app"></div>
<div id="layer"></div>
<script>
/* ===== 이 게임의 설정과 문제 — 엔진(../engine/escape.js)은 모든 게임이 함께 씁니다 ===== */
const GAME = {
  id:'kids', title:'하늘빛 폐교 탈출', subtitle:'덧셈 · 뺄셈 · 곱셈 편', kid:true, lockMs:10000,
  intro:'오래전 문을 닫은 옛 하늘빛 학교. 눈을 떠 보니 정문이 잠겨 있어요! 덧셈, 뺄셈, 곱셈으로 잠긴 문 네 개를 열고, 교장실 금고에서 정문 열쇠를 찾아 탈출하세요. 한 사람씩 도전해요.',
  sign:'하 늘 빛 학', graffiti:'안녕?', classLabel:'3학년 2반', roomExample:'우리 집 탈출 대회'
};
/* 무작위 범위 설계 — 금고 암호(탈출성공)를 지키기 위해 정답 범위가 겹치지 않게 했습니다
   4번 문 100~199  <  2번 문 300~499  <  1번 문 700~899  <  3번 문 900~999
   덧셈은 받아올림 두 번, 뺄셈은 십의 자리가 0이라 받아내림 두 번이 반드시 들어갑니다 */
const F = {};
const BIG=n=>`<span style="font-size:1.8rem">${n}</span>`;
const STAGES = [
  { title:'첫 번째 문 · 3학년 2반 교실', scene:'cls', letter:'성', unit:'',
    story:'3학년 2반 교실. 칠판에 분필로 "안녕?"이라고 쓰여 있다. 교실 문 옆 사물함이 숫자 자물쇠로 잠겨 있고, 그 안에 문 열쇠가 있는 것 같다.',
    q:'사물함 자물쇠의 비밀번호는?',
    trapNames:{nocarry:'받아올림을 빼먹음'},
    make(r){ let oa,ob,ta,tb,ha,hb;
      do{ oa=randInt(r,2,9); ob=randInt(r,2,9); }while(oa+ob<10);
      do{ ta=randInt(r,1,9); tb=randInt(r,1,9); }while(ta+tb+1<10||ta+tb+1>18);
      do{ ha=randInt(r,1,6); hb=randInt(r,1,6); }while(ha+hb+1<7||ha+hb+1>8);
      const a=ha*100+ta*10+oa, b=hb*100+tb*10+ob, ans=a+b;
      const nc=(ha+hb)*100+((ta+tb)%10)*10+(oa+ob)%10, h=Math.floor(ans/100)*100;
      return { ans:{n:ans}, traps:[{id:'nocarry',v:nc}],
        cards:[
          {tag:'빨간 쪽지', body:BIG(a)},{tag:'파란 쪽지', body:BIG(b)},
          {tag:'칠판의 글씨', body:'두 쪽지의 수를 더하면 사물함 비밀번호!'},
          {tag:'책상 위 메모', body:'일의 자리부터 더해요.<br>10이 넘으면 윗자리로 1을 올려요.'},
          {tag:'사물함 옆 낙서', body:`비밀번호는 ${h}보다 커.`}],
        hints:[`일의 자리: ${oa} + ${ob} = ${oa+ob} → ${(oa+ob)%10}을 쓰고 1을 올려요. 십의 자리에서도 올림이 한 번 더 있어요.`,
               `십의 자리: ${ta} + ${tb} + 1 = ${ta+tb+1} → ${(ta+tb+1)%10}을 쓰고 1을 올려요. 백의 자리: ${ha} + ${hb} + 1`],
        explain:`<b>풀이</b> ${a} + ${b} = ${ans} (일의 자리와 십의 자리에서 한 번씩 받아올림)` }; } },

  { title:'두 번째 문 · 과학실', scene:'sci', letter:'출', unit:'',
    story:'과학실에 들어서니 비커에서 보글보글 소리가 난다. 칠판과 비커에 숫자가 하나씩 적혀 있고, 표본 병 속 무언가가 이쪽을 보는 것 같다.',
    q:'과학실 문의 비밀번호는?',
    trapNames:{flip:'작은 자리 숫자에서 큰 숫자를 거꾸로 뺌'},
    make(r){ let M,N,ans,hm,u,nh,nt,no;
      do{ hm=randInt(r,6,9); u=randInt(r,0,7); nh=randInt(r,1,hm-1); nt=randInt(r,1,9); no=randInt(r,u+1,9);
          M=hm*100+u; N=nh*100+nt*10+no; ans=M-N; }while(ans<300||ans>499);
      const flip=Math.abs(hm-nh)*100+Math.abs(0-nt)*10+Math.abs(u-no);
      return { ans:{n:ans}, traps:[{id:'flip',v:flip}],
        cards:[
          {tag:'과학실 칠판', body:BIG(M)},{tag:'비커 라벨', body:BIG(N)},
          {tag:'실험 노트', body:'큰 수에서 작은 수를 빼면 문이 열린다.'},
          {tag:'선생님 메모', body:'뺄 수 없으면 윗자리에서 10을 빌려 와요.<br>윗자리가 0이면 그 윗자리에서 먼저 빌려요.'},
          {tag:'벽의 낙서', body:`답은 ${Math.floor(ans/100)*100}과 ${Math.floor(ans/100)*100+100} 사이야.`}],
        hints:[`일의 자리 ${u}에서 ${no}을(를) 뺄 수 없어요. 십의 자리가 0이라서 백의 자리에서 먼저 빌려 와야 해요.`,
               `${M}를 ${hm-1}백 · 9십 · ${u+10}로 바꿔 생각해요. ${u+10} − ${no}, 9 − ${nt}, ${hm-1} − ${nh}`],
        explain:`<b>풀이</b> ${M} − ${N} = ${ans} (백의 자리 → 십의 자리 → 일의 자리로 두 번 받아내림)` }; } },

  { title:'세 번째 문 · 도서실', scene:'lib', letter:'공', unit:'권',
    story:'불 꺼진 도서실. 아무도 없는데 책장 넘기는 소리가 들린다. 책이 모두 몇 권인지 맞히면 책장 뒤 비밀 통로가 열린다.',
    q:'도서실의 책은 모두 몇 권?',
    trapNames:{shift:'둘째 줄 자리를 안 맞춤'},
    make(r){ let x,y,ans;
      do{ x=randInt(r,21,49); y=randInt(r,21,49); ans=x*y; }while(ans<900||ans>999||y%10===0||x%10===0);
      const t=Math.floor(y/10), o=y%10;
      return { ans:{n:ans}, traps:[{id:'shift',v:x*t+x*o}],
        cards:[
          {tag:'사서 선생님 메모', body:`책장은 모두 ${x}칸`},
          {tag:'대출 카드', body:`한 칸에 책이 ${y}권씩`},
          {tag:'책갈피', body:`${y} = ${t*10} + ${o}`},
          {tag:'도서실 공지', body:'두 자리 수 곱셈은 한 줄씩 곱해서 자리를 맞춰 더해요.'},
          {tag:'책상 위 낙서', body:'답은 900보다 크고 1000보다 작아.'}],
        hints:[`${x} × ${y} = ${x} × ${t*10} + ${x} × ${o}`,
               `${x} × ${t*10} = ${x*t*10}, ${x} × ${o} = ${x*o}. 두 수를 더해요.`],
        explain:`<b>풀이</b> ${x} × ${y} = ${x*t*10} + ${x*o} = ${ans} 권` }; } },

  { title:'네 번째 문 · 교무실', scene:'off', letter:'탈', unit:'개',
    story:'교무실 책상 위에 급식실 우유 기록이 펼쳐져 있다. 남은 우유가 몇 개인지 적어 넣으면 열쇠 서랍이 열린다고 쓰여 있다.',
    q:'남은 우유는 몇 개?',
    trapNames:{nosub:'마신 우유를 빼지 않음'},
    make(r){ let bx,p,T,d,ans;
      do{ bx=randInt(r,9,16); p=pick(r,[20,25]); T=bx*p; d=randInt(r,101,T-100); ans=T-d; }while(ans<100||ans>199||d<100);
      return { ans:{n:ans}, traps:[{id:'nosub',v:T}],
        cards:[
          {tag:'급식실 메모', body:`우유 상자 ${bx}개`},
          {tag:'상자 라벨', body:`한 상자에 우유 ${p}개씩`},
          {tag:'출석부 뒷면', body:`오늘 마신 우유 ${d}개`},
          {tag:'교무실 공지', body:'먼저 우유가 모두 몇 개인지 구한 다음, 마신 만큼 빼요.'},
          {tag:'서랍 옆 낙서', body:`${p}개씩 4상자면 ${p*4}개.`}],
        hints:[`먼저 우유가 모두 몇 개인지 구해요: ${bx} × ${p}`,
               `${bx} × ${p} = ${T}. 이제 ${T} − ${d}을(를) 계산해요.`],
        explain:`<b>풀이</b> ${bx} × ${p} = ${T}개, ${T} − ${d} = ${ans}개` }; } },

  { title:'마지막 금고 · 교장실', vault:true, scene:'vlt',
    story:'교장실 구석에 네 칸짜리 글자 자물쇠가 달린 금고가 있다. 정문 열쇠가 이 안에 있다. 복도에서 발소리가 점점 가까워진다.',
    q:'금고의 네 글자 암호는?', word:'탈출성공', traps:[{id:'order',v:'성출공탈'}], trapNames:{order:'얻은 순서대로 읽음'},
    clue:'열쇠 숫자가 작은 문에서 얻은 글자부터 차례로 읽어라.<br><span class="small dim">열쇠 숫자는 그 문을 열 때 입력한 답이다.</span>',
    hints:['글자를 얻은 순서대로 읽으면 말이 안 돼요. 글자 아래의 열쇠 숫자를 작은 것부터 늘어놓아 보세요.',
           '열쇠 숫자를 작은 것부터: 4번째 문 → 2번째 문 → 1번째 문 → 3번째 문'],
    explain:'<b>풀이</b> 열쇠 숫자가 작은 순서: 4번째 문(탈) · 2번째 문(출) · 1번째 문(성) · 3번째 문(공) → <b>탈출성공</b>!' },

  { title:'도전 방 · 지하 창고', bonus:true, scene:'bsm', unit:'개',
    story:'정문 옆, 지하 창고로 내려가는 계단이 있다. 탈출한 사람만 내려갈 수 있다. 백열전구 아래 사탕 상자가 쌓여 있다.',
    q:'창고에 남은 사탕은 몇 개?',
    make(r){ const bx=randInt(r,12,19), p=pick(r,[25,35,45]), T=bx*p, t=randInt(r,150,Math.min(299,T-150));
      return { ans:{n:T-t},
        cards:[
          {tag:'상자 더미', body:`사탕 상자 ${bx}개`},
          {tag:'상자 라벨', body:`한 상자에 사탕 ${p}개씩`},
          {tag:'벽의 낙서', body:`누군가 사탕 ${t}개를 몰래 가져갔다!`},
          {tag:'창고 쪽지', body:`${p} × ${bx} = ${p} × 10 + ${p} × ${bx-10}`},
          {tag:'바닥의 글씨', body:`남은 사탕은 ${Math.floor((T-t)/100)*100}개보다 많아.`}],
        hints:[`먼저 사탕이 모두 몇 개였는지: ${p} × ${bx} = ${p*10} + ${p*(bx-10)}`,
               `${p} × ${bx} = ${T}. 이제 ${T} − ${t}을(를) 계산해요.`],
        explain:`<b>풀이</b> ${p} × ${bx} = ${T}개, ${T} − ${t} = ${T-t}개` }; } }
];
</script>
<script src="../engine/escape.js?v=2"></script>
</body>
</html>
