<script>
/* =============================================================
   시트로 만드는 방탈출 — 구글 시트를 읽어 문제를 만들고 공통 엔진을 띄웁니다
   교사: ?sheet=시트ID   학생: ?code=수업코드 (문제는 Firebase의 그 수업에서 받음)
   ============================================================= */
const DB_URL='https://math-game-a024b-default-rtdb.asia-southeast1.firebasedatabase.app';
const ENGINE_SRC='../engine/escape.js?v=4';
const $l=s=>document.querySelector(s);
const escH=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- CSV 읽기 ---------- */
function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim()));
}

/* ---------- 식 계산기 (안전: 숫자·변수·정해진 함수만) ---------- */
const FN={
  '택':(k,...xs)=>xs[Math.round(k)-1], choose:(k,...xs)=>xs[Math.round(k)-1],
  '내림':Math.floor, floor:Math.floor, '올림':Math.ceil, ceil:Math.ceil,
  '반올림':(x,d=0)=>Math.round(x*10**d)/10**d, round:(x,d=0)=>Math.round(x*10**d)/10**d,
  abs:Math.abs, '절댓값':Math.abs, sqrt:Math.sqrt, '루트':Math.sqrt, min:Math.min, max:Math.max,
  '몫':(a,b)=>Math.floor(a/b), '나머지':(a,b)=>((a%b)+b)%b,
  '자리':(n,k)=>Math.floor(Math.abs(n)/10**(k-1))%10   // 자리(345,1)=5 (일의 자리), 자리(345,2)=4
};
function tokenize(s){
  const out=[];let i=0;s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/−/g,'-');
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue}
    let m=s.slice(i).match(/^\d+(\.\d+)?/); if(m){out.push({t:'n',v:parseFloat(m[0])});i+=m[0].length;continue}
    m=s.slice(i).match(/^[A-Za-z_가-힣][A-Za-z0-9_가-힣]*/); if(m){const w=m[0];
      if(w==='그리고'||w==='and')out.push({t:'o',v:'&&'});else if(w==='또는'||w==='or')out.push({t:'o',v:'||'});else out.push({t:'i',v:w});i+=w.length;continue}
    m=s.slice(i).match(/^(<=|>=|==|!=|&&|\|\||[-+*/%^(),<>=!])/); if(m){out.push({t:'o',v:m[0]==='='?'==':m[0]});i+=m[0].length;continue}
    throw new Error(`식에 쓸 수 없는 글자 "${c}"`)}
  return out;
}
function compileExpr(src){
  const tk=tokenize(src);let p=0;
  const peek=()=>tk[p], eat=v=>{const t=tk[p];if(!t||(v&&t.v!==v))throw new Error(`식이 이상합니다 (${v?'"'+v+'" 필요':'끝남'})`);p++;return t};
  const BP={'||':1,'&&':2,'==':3,'!=':3,'<':4,'<=':4,'>':4,'>=':4,'+':5,'-':5,'*':6,'/':6,'%':6,'^':8};
  function prim(){const t=eat();
    if(t.t==='n')return()=>t.v;
    if(t.t==='o'&&t.v==='('){const e=expr(0);eat(')');return e}
    if(t.t==='o'&&t.v==='-'){const e=expr(7);return env=>-e(env)}
    if(t.t==='o'&&t.v==='+'){return expr(7)}
    if(t.t==='o'&&t.v==='!'){const e=expr(7);return env=>e(env)?0:1}
    if(t.t==='i'){
      if(peek()&&peek().v==='('){const f=FN[t.v];if(!f)throw new Error(`모르는 함수 "${t.v}"`);eat('(');const args=[];
        if(peek()&&peek().v!==')'){args.push(expr(0));while(peek()&&peek().v===','){eat(',');args.push(expr(0))}}eat(')');return env=>f(...args.map(a=>a(env)))}
      return env=>{if(!(t.v in env))throw new Error(`정하지 않은 변수 "${t.v}"`);return env[t.v]}}
    throw new Error(`식이 이상합니다 ("${t.v}")`)}
  function expr(minbp){let l=prim();
    for(;;){const t=peek();if(!t||t.t!=='o'||!(t.v in BP))break;const bp=BP[t.v];if(bp<minbp)break;p++;
      const r=expr(t.v==='^'?bp:bp+1),L=l,op=t.v;
      l={'+':e=>L(e)+r(e),'-':e=>L(e)-r(e),'*':e=>L(e)*r(e),'/':e=>L(e)/r(e),'%':e=>L(e)%r(e),'^':e=>L(e)**r(e),
         '<':e=>+(L(e)<r(e)),'<=':e=>+(L(e)<=r(e)+1e-9),'>':e=>+(L(e)>r(e)),'>=':e=>+(L(e)+1e-9>=r(e)),
         '==':e=>+(Math.abs(L(e)-r(e))<1e-9),'!=':e=>+(Math.abs(L(e)-r(e))>=1e-9),'&&':e=>+(L(e)&&r(e)),'||':e=>+(L(e)||r(e))}[op]}
    return l}
  if(!tk.length)throw new Error('식이 비어 있습니다');
  const f=expr(0);if(p<tk.length)throw new Error(`식 뒤에 남는 글자 "${tk[p].v}"`);return f;
}
const fmtNum=v=>{if(typeof v!=='number'||!isFinite(v))return String(v);const r=Math.round(v*1e9)/1e9;return String(r)};

/* ---------- 변수 칸: a = 20~52 간격 2 / b = 3, 4, 6 / C = (180-a)/2 ---------- */
function compileVars(src){
  const out=[];
  String(src||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^([A-Za-z_가-힣][A-Za-z0-9_가-힣]*)\s*=\s*(.+)$/);if(!m)throw new Error(`변수 줄을 읽지 못함: "${line}" (예: a = 1~9)`);
    const name=m[1], rhs=m[2].trim();
    let r=rhs.match(/^(-?\d+(?:\.\d+)?)\s*~\s*(-?\d+(?:\.\d+)?)(?:\s*(?:간격|\/|step)\s*(\d+(?:\.\d+)?))?$/);
    if(r){const lo=+r[1],hi=+r[2],st=r[3]?+r[3]:1;if(hi<lo)throw new Error(`${name}: 범위가 거꾸로입니다`);const vals=[];for(let v=lo;v<=hi+1e-9;v+=st)vals.push(Math.round(v*1e9)/1e9);
      if(vals.length>5000)throw new Error(`${name}: 값이 너무 많습니다`);out.push({name,vals});return}
    if(/^-?\d+(\.\d+)?(\s*,\s*-?\d+(\.\d+)?)+$/.test(rhs)){out.push({name,vals:rhs.split(',').map(x=>+x.trim())});return}
    out.push({name,fn:compileExpr(rhs)});
  });
  return out;
}
/* 글 안의 {식} 채우기 */
function compileText(src){
  const s=String(src||'');const parts=[];let i=0;
  while(i<s.length){const a=s.indexOf('{',i);if(a<0){parts.push(s.slice(i));break}const b=s.indexOf('}',a);if(b<0)throw new Error('{ 를 닫는 } 가 없습니다');
    parts.push(s.slice(i,a));parts.push(compileExpr(s.slice(a+1,b)));i=b+1}
  return env=>parts.map(p=>typeof p==='function'?fmtNum(p(env)):p).map(x=>escH(x)).join('').replace(/\n/g,'<br>');
}
function safeFig(v,key){
  v=String(v||'').trim();if(!v)return null;
  if(/^<svg[\s>]/i.test(v)){if(/<script|<foreignObject|\son\w+\s*=|javascript:|<iframe|<image|href\s*=/i.test(v))throw new Error('그림(SVG)에 쓸 수 없는 코드가 있습니다');return v.replace(/^<svg/i,'<svg class="fig"')}
  let m=v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(m)v='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000';
  if(!/^https:\/\/[^\s"'<>]+$/.test(v))throw new Error('그림은 https:// 로 시작하는 주소나 <svg> 코드만 쓸 수 있습니다');
  return `<img class="fig" src="${escH(v)}" alt="문제 그림" style="max-width:100%;height:auto;border-radius:6px;background:#fff">`;
}

/* ---------- 시트 → GAME / F / STAGES ---------- */
const COLS={문:'kind',장소:'place',이야기:'story',질문:'q',단서1:'c1',단서2:'c2',단서3:'c3',단서4:'c4',단서5:'c5',그림:'fig',변수:'vars',조건:'cond',정답:'ans',고르기:'choose',단위:'unit',글자:'letter',힌트1:'h1',힌트2:'h2',풀이:'explain',함정1:'t1',함정2:'t2',함정3:'t3'};
const ORD=['첫 번째 문','두 번째 문','세 번째 문','네 번째 문'], SCN=['cls','sci','lib','off','vlt','bsm'];
function kindOf(a){a=String(a||'').replace(/\s/g,'');if(!a||/^[※*#]/.test(a)||a.length>6)return null;if(a.includes('금고'))return 4;if(a.includes('도전'))return 5;
  const m=a.match(/[1-4]/);if(m&&a.length<=6)return +m[0]-1;const k={'첫':0,'둘':1,'두':1,'셋':2,'세':2,'넷':3,'네':3}[a[0]];return (k!=null&&a.includes('문'))?k:null}
function readSheet(rows){
  const hi=rows.findIndex(r=>(r[0]||'').replace(/\s/g,'')==='문'&&r.some(x=>x.replace(/\s/g,'')==='정답'));
  if(hi<0)throw new Error('시트에서 "문 · 장소 · … · 정답" 제목 줄을 찾지 못했습니다. 견본 시트의 제목 줄을 지우지 마세요.');
  const set={};rows.slice(0,hi).forEach(r=>{if(r[0])set[r[0].replace(/\s/g,'')]=r[1]||''});
  const head=rows[hi].map(h=>COLS[h.replace(/\s/g,'')]||null);
  const st={};const dup=[];
  rows.slice(hi+1).forEach(r=>{const k=kindOf(r[0]);if(k==null)return;const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]||''});if(st[k])dup.push(r[0]);st[k]=o});
  return {set,st,dup};
}
function findSet(set,...keys){for(const k of Object.keys(set))if(keys.some(x=>k.includes(x)))return set[k];return ''}
function buildGame(rows){
  const {set,st,dup}=readSheet(rows);
  const errors=[], warn=[];
  dup.forEach(d=>warn.push(`"${d}" 줄이 두 번 있습니다. 아래쪽 줄을 씁니다.`));
  for(let i=0;i<5;i++)if(!st[i])errors.push(`${i<4?ORD[i]:'금고'} 줄이 없습니다.`);
  const yes=v=>/^(예|네|o|y|yes|true|1|아이용)$/i.test(String(v).trim());
  const GAME={id:'sheet', title:findSet(set,'제목')||'시트로 만든 방탈출', subtitle:findSet(set,'부제'),
    intro:escH(findSet(set,'소개')||'잠긴 문 네 개를 열고, 마지막 금고에서 정문 열쇠를 찾아 탈출하라. 한 사람씩 도전하는 개인전이다.'),
    classLabel:findSet(set,'교실')||'2학년 3반', sign:findSet(set,'간판','학교')||'진 해 중 학', graffiti:findSet(set,'낙서')||'나가지 마',
    roomExample:findSet(set,'수업이름예시')||'2학년 3반', lockMs:Math.max(3,Math.min(120,parseFloat(String(findSet(set,'잠금')).replace(/[^\d.]/g,''))||10))*1000,
    kid:yes(findSet(set,'아이용'))};
  GAME.title=escH(GAME.title);GAME.subtitle=escH(GAME.subtitle);GAME.classLabel=escH(GAME.classLabel);GAME.sign=escH(GAME.sign);GAME.graffiti=escH(GAME.graffiti);GAME.roomExample=escH(GAME.roomExample);
  const F={}, STAGES=[];
  const n=st[5]?6:5;
  for(let i=0;i<n;i++){const o=st[i];if(!o){STAGES.push(null);continue}
    const label=i<4?ORD[i]:i===4?'금고':'도전 방';
    try{STAGES.push(buildStage(i,o,F))}catch(e){errors.push(`${label}: ${e.message}`);STAGES.push(null)}}
  if(!errors.length){
    const v=STAGES[4];
    if(!v.word)errors.push('금고: 정답 칸에 네 글자 암호를 적어 주세요.');
    const letters=STAGES.slice(0,4).map(s=>s.letter);
    if(letters.some(l=>!l))errors.push('문 1~4 모두 글자 칸이 필요합니다.');
    if(v.word&&letters.every(Boolean)&&[...v.word].sort().join('')!==letters.slice().sort().join(''))errors.push(`금고 암호 "${v.word}"의 글자와 문 네 개의 글자(${letters.join('·')})가 서로 맞지 않습니다.`);
  }
  return {GAME,F,STAGES,errors,warn};
}
function buildStage(i,o,F){
  const isV=i===4, isB=i===5;
  const place=o.place||(isV?'교장실':isB?'지하 창고':'');
  const s={title:(isV?'마지막 금고':isB?'도전 방':ORD[i])+(place?' · '+escH(place):''), scene:SCN[i], unit:escH(o.unit||''),
    story:escH(o.story||(isV?'네 칸짜리 글자 자물쇠가 달린 금고가 있다. 정문 열쇠가 이 안에 있다.':isB?'탈출한 사람만 내려갈 수 있는 곳이다.':'')).replace(/\n/g,'<br>')};
  if(isV){
    s.vault=true;s.word=(o.ans||'').replace(/\s/g,'');s.q=escH(o.q||`금고의 ${s.word.length||4}글자 암호는?`);
    s.clue='열쇠 숫자가 작은 문에서 얻은 글자부터 차례로 읽어라.<br><span class="small dim">열쇠 숫자는 그 문을 열 때 입력한 답이다.</span>';
    s.traps=[];s.trapNames={};
    ['t1','t2','t3'].forEach((k,j)=>{const t=o[k];if(!t)return;const a=t.indexOf(':');const v=(a<0?t:t.slice(0,a)).replace(/\s/g,''),d=a<0?'함정 '+(j+1):t.slice(a+1).trim();s.traps.push({id:k,v});s.trapNames[k]=escH(d)});
    s.hints=[o.h1,o.h2].filter(Boolean).map(x=>escH(x).replace(/\n/g,'<br>'));
    s.explain=o.explain?escH(o.explain).replace(/\n/g,'<br>'):'';
    return s;
  }
  if(!isB){s.letter=escH((o.letter||'').trim());if([...(o.letter||'').trim()].length!==1)throw new Error('글자 칸에 한 글자를 적어 주세요.')}else s.bonus=true;
  if(!o.ans)throw new Error('정답 칸이 비어 있습니다.');
  const vars=compileVars(o.vars), ansF=compileExpr(o.ans);
  const conds=String(o.cond||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(compileExpr);
  let choose=null;
  if(o.choose){const a=o.choose.indexOf(':');const lab=a<0?'고르기':o.choose.slice(0,a).trim();const opts=(a<0?o.choose:o.choose.slice(a+1)).split(',').map(x=>x.trim()).filter(Boolean);
    const right=opts.filter(x=>x.endsWith('*'));if(right.length!==1)throw new Error('고르기 칸에서 맞는 보기 하나 끝에 * 를 붙여 주세요. (예: 합동 조건: RHA*, RHS, SAS)');
    choose={label:escH(lab),opts:opts.map(x=>escH(x.replace(/\*$/,'').trim())),ans:escH(right[0].replace(/\*$/,'').trim())}}
  if(choose){s.cond=true;s.condLabel=choose.label;s.condOpts=choose.opts;s.numLabel='답'}
  const qF=compileText(o.q||'답은?');
  const cardF=['c1','c2','c3','c4','c5'].map(k=>o[k]).filter(Boolean).map((c,j)=>{const a=c.indexOf('|');return {tag:compileText(a<0?'단서 '+(j+1):c.slice(0,a).trim()),body:compileText(a<0?c:c.slice(a+1).trim())}});
  const fig=safeFig(o.fig);let figKey=null;if(fig){figKey='sh'+i;F[figKey]=fig}
  if(!cardF.length&&!fig)throw new Error('단서가 하나도 없습니다.');
  const hintF=[o.h1,o.h2].filter(Boolean).map(compileText), expF=compileText(o.explain||'');
  const trapDefs=['t1','t2','t3'].map(k=>[k,o[k]]).filter(x=>x[1]).map(([k,t])=>{const a=t.indexOf(':');if(a<0)throw new Error(`함정은 "식 : 설명" 모양으로 적어 주세요. (예: a : ∠DBC를 답으로 씀)`);return {id:k,f:compileExpr(t.slice(0,a)),name:escH(t.slice(a+1).trim())}});
  s.trapNames={};trapDefs.forEach(t=>s.trapNames[t.id]=t.name);
  s.make=function(r){
    let env,ans,ok=false;
    for(let tries=0;tries<400&&!ok;tries++){
      env={};vars.forEach(v=>{env[v.name]=v.vals?v.vals[Math.floor(r()*v.vals.length)]:v.fn(env)});
      ans=Math.round(ansF(env)*1e9)/1e9;env['답']=ans;env.ans=ans;
      ok=conds.every(c=>c(env));
    }
    const cards=cardF.map((c,j)=>({tag:c.tag(env),body:c.body(env)}));
    if(figKey){if(cards.length)cards[0].fig=figKey;else cards.push({tag:'그림',body:'',fig:figKey})}
    const out={q:qF(env),ans:{n:ans},cards,hints:hintF.map(h=>h(env)),explain:expF(env),traps:trapDefs.map(t=>({id:t.id,v:Math.round(t.f(env)*1e9)/1e9})),_ok:ok};
    if(choose)out.ans.cond=choose.ans;
    if(!out.explain)out.explain=`<b>정답</b> ${fmtNum(ans)}${s.unit}`;
    return out;
  };
  return s;
}

/* ---------- 점검: 1,000번 만들어 보고 문제를 찾기 ---------- */
function mulberry(seed){let a=(seed>>>0)||1;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function checkGame(g,N=1000){
  const rep=[];const {STAGES}=g;
  const doors=STAGES.slice(0,4), v=STAGES[4];
  let orderBad=0, orders={};
  const stat=STAGES.map(()=>({min:Infinity,max:-Infinity,set:new Set(),noCond:0,nan:0,trapEq:0,err:''}));
  for(let seed=1;seed<=N;seed++){
    const inst=STAGES.map((s,i)=>{if(!s||s.vault)return s;try{return Object.assign({},s,s.make(mulberry((seed*2654435761^(i*40503+17))>>>0)))}catch(e){stat[i].err=e.message;return null}});
    inst.forEach((x,i)=>{if(!x||x.vault)return;const n=x.ans.n,o=stat[i];
      if(typeof n!=='number'||!isFinite(n)){o.nan++;return}
      if(!x._ok)o.noCond++;o.min=Math.min(o.min,n);o.max=Math.max(o.max,n);o.set.add(n);
      if(x.traps.some(t=>Math.abs(t.v-n)<1e-9))o.trapEq++});
    if(inst.slice(0,4).every(x=>x&&isFinite(x.ans.n))){
      const w=inst.slice(0,4).map((d,i)=>({l:d.letter,n:d.ans.n,i})).sort((a,b)=>a.n-b.n||9);
      const word=w.map(x=>x.l).join('');orders[w.map(x=>x.i+1).join('→')]=1;
      if(word!==v.word||new Set(w.map(x=>x.n)).size<4)orderBad++}
  }
  STAGES.forEach((s,i)=>{if(!s||s.vault)return;const o=stat[i],lab=s.title;
    if(o.err)rep.push(['err',lab,'글자를 채우다 오류: '+o.err]);
    if(o.nan)rep.push(['err',lab,`정답이 숫자가 아닌 경우 ${o.nan}번 (0으로 나누기, 변수 이름 확인)`]);
    if(o.noCond)rep.push(['warn',lab,`조건을 만족하는 숫자를 못 찾은 경우 ${o.noCond}번 — 조건이 너무 까다롭습니다`]);
    if(o.trapEq)rep.push(['warn',lab,`함정 값이 정답과 같아진 경우 ${o.trapEq}번 — 조건 칸에서 그런 숫자를 빼세요`]);
    if(!o.err&&!o.nan)rep.push(['ok',lab,`정답 ${fmtNum(o.min)}${o.min!==o.max?' ~ '+fmtNum(o.max):''}${s.unit?' '+s.unit:''} · ${o.set.size}가지`]);
  });
  if(orderBad)rep.push(['err','마지막 금고',`${N}번 중 ${orderBad}번 암호가 "${v.word}"가 되지 않습니다. 문마다 정답 범위가 겹치지 않게 변수 범위를 조정하세요.`]);
  else rep.push(['ok','마지막 금고',`${N}번 모두 암호 "${v.word}" (읽는 순서 ${Object.keys(orders)[0]})`]);
  if(!v.hints.length){const ord=Object.keys(orders)[0];if(ord&&!orderBad){v.hints=['글자를 얻은 순서대로 읽으면 뜻이 없습니다. 글자 아래의 열쇠 숫자를 비교하세요.','열쇠 숫자를 작은 것부터 놓아 보세요. '+ord.split('→').map(x=>x+'번째 문').join(' → ')+' 순서가 됩니다.']}}
  if(!v.explain)v.explain=`<b>풀이</b> 열쇠 숫자가 작은 순서대로 읽으면 <b>${escH(v.word)}</b>`;
  if(!v.traps.length){const got=doors.map(d=>d.letter).join('');if(got!==v.word){v.traps.push({id:'order',v:got});v.trapNames.order='얻은 순서대로 읽음'}}
  return rep;
}

/* ---------- 불러오기 ---------- */
function sheetUrls(id){
  if(id.startsWith('e/'))return ['https://docs.google.com/spreadsheets/d/'+id+'/pub?output=csv'];
  return ['https://docs.google.com/spreadsheets/d/'+id+'/export?format=csv','https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&headers=0'];
}
async function fetchSheet(id){
  let last='';
  for(const u of sheetUrls(id)){try{const r=await fetch(u,{cache:'no-store'});const t=await r.text();if(r.ok&&!/^\s*<(!doctype|html)/i.test(t))return t;last='공유 설정 확인 필요 ('+r.status+')'}catch(e){last=String(e.message||e)}}
  throw new Error('시트를 읽지 못했습니다. 시트의 [공유] → 일반 액세스를 "링크가 있는 모든 사용자 · 뷰어"로 바꿔 주세요. ('+last+')');
}
function sheetIdFrom(s){s=String(s||'').trim();let m=s.match(/\/d\/(e\/[\w-]+)/);if(m)return m[1];m=s.match(/\/d\/([\w-]{20,})/);if(m)return m[1];if(/^(e\/)?[\w-]{20,}$/.test(s))return s;return ''}
function bootEngine(g,rows){
  window.GAME=g.GAME;window.F=g.F;window.STAGES=g.STAGES;
  if(rows)g.GAME.onRoomCreated=async(code,S)=>{await S.set('rooms/'+code+'/sheet',{csv:JSON.stringify(rows),title:g.GAME.title,at:Date.now()})};
  document.title=g.GAME.title.replace(/&[^;]+;/g,'')+' · 방탈출';
  const sc=document.createElement('script');sc.src=ENGINE_SRC;document.body.appendChild(sc);
}
function shell(inner){$l('#app').innerHTML=`<div class="hero" style="text-align:left">${inner}</div>`}
function showStart(msg){
  shell(`<div class="dim" style="letter-spacing:.2em">시트로 만드는</div><h1>방탈출</h1>
    ${msg?`<div class="banner" style="margin-top:12px">${msg}</div>`:''}
    <div class="sheet" style="margin-top:16px"><div class="in stack">
      <h3>학생</h3><label class="f" for="cd">수업 코드</label><input class="t num" id="cd" inputmode="numeric" maxlength="4" placeholder="선생님 화면의 숫자 4자리">
      <button class="btn primary block" id="goS">입장하기</button></div></div>
    <div class="sheet"><div class="in stack">
      <h3>선생님</h3><label class="f" for="su">구글 시트 주소</label><input class="t" id="su" placeholder="https://docs.google.com/spreadsheets/d/…">
      <button class="btn block" id="goT">시트 불러오기</button>
      <p class="small dim">처음이라면 <a href="template.csv" download="방탈출_문제시트_견본.csv" style="color:var(--amber)">견본 시트(CSV)</a>를 내려받아 구글 시트에서 [파일 → 가져오기]로 연 뒤 문제를 바꿔 쓰세요. 시트의 [공유]에서 일반 액세스를 <b>링크가 있는 모든 사용자 · 뷰어</b>로 바꿔야 게임이 읽을 수 있습니다.</p></div></div>`);
  $l('#goS').onclick=()=>{const c=$l('#cd').value.trim();if(/^\d{4}$/.test(c))location.search='?code='+c};
  $l('#goT').onclick=()=>{const id=sheetIdFrom($l('#su').value);if(id)location.search='?sheet='+encodeURIComponent(id);else alert('시트 주소를 확인해 주세요.')};
}
function showReport(g,rep,rows){
  const bad=g.errors.length||rep.some(x=>x[0]==='err');
  const ic={ok:'✅',warn:'⚠️',err:'❌'};
  const list=g.errors.map(e=>['err','',e]).concat(g.warn.map(w=>['warn','',w]),rep);
  shell(`<div class="dim" style="letter-spacing:.2em">${g.GAME.subtitle||'시트로 만든 방탈출'}</div><h1>${g.GAME.title}</h1>
    <div class="sheet" style="margin-top:16px"><div class="in"><h3>문제 점검 결과</h3>
    <p class="dim small" style="margin-top:2px">문제를 1,000번 만들어 보고 확인했습니다.</p>
    <ul style="list-style:none;padding:0;margin:10px 0 0">${list.map(([k,a,b])=>`<li style="padding:6px 0;border-top:1px solid var(--line)">${ic[k]} ${a?`<b>${escH(a)}</b> — `:''}${escH(b)}</li>`).join('')}</ul></div></div>
    <button class="btn primary block" id="open" ${bad?'disabled':''}>${bad?'❌ 표시를 고친 뒤 새로고침하세요':'게임 열기'}</button>
    <button class="btn block" id="reload" style="margin-top:8px">시트 고친 뒤 다시 읽기</button>`);
  $l('#reload').onclick=()=>location.reload();
  if(!bad)$l('#open').onclick=()=>bootEngine(g,rows);
}
(async()=>{
  const qs=new URLSearchParams(location.search), sid=qs.get('sheet'), code=qs.get('code');
  try{
    if(sid){shell('<p class="dim">시트를 읽는 중…</p>');
      const rows=parseCSV(await fetchSheet(sid)), g=buildGame(rows);
      const rep=g.errors.length?[]:checkGame(g);showReport(g,rep,rows);
    }else if(code){shell('<p class="dim">수업을 찾는 중…</p>');
      const r=await fetch(DB_URL+'/rooms/'+encodeURIComponent(code)+'/sheet.json',{cache:'no-store'});const d=r.ok?await r.json():null;
      if(!d||!d.csv)return showStart('수업 코드 '+escH(code)+'를 찾지 못했습니다. 숫자를 다시 확인하세요.');
      const g=buildGame(JSON.parse(d.csv));if(g.errors.length)return showStart('문제를 읽지 못했습니다. 선생님께 알려 주세요.');
      checkGame(g,200);bootEngine(g,null);
    }else showStart('');
  }catch(e){showStart(escH(e.message||e))}
})();
</script>
