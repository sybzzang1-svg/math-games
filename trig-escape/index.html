<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>

<script>
/* ===== 이 게임의 설정과 문제 — 엔진(../engine/escape.js)은 모든 게임이 함께 씁니다 ===== */
const GAME = {
  id:'trig', title:'진해중 폐교 탈출', subtitle:'삼각비 편',
  intro:'오래전 문을 닫은 옛 진해중학교 건물. 정신을 차리니 정문이 잠겨 있다. 삼각비로 잠긴 문 네 개를 열고, 교장실 금고에서 정문 열쇠를 찾아 탈출하라. 한 사람씩 도전하는 개인전이다. 학생마다 숫자가 다르다.',
  classLabel:'3학년 2반', roomExample:'3학년 2반 삼각비', lockMs:10000
};
/* 무작위 범위 설계 — 금고 암호(삼각측량)를 지키기 위해 정답 범위가 겹치지 않게 했습니다
   2번 문 2~4  <  1번 문 10·13·15  <  4번 문 16~36  <  3번 문 41.4~61.6 */
const F = {
  // 방1 ∠C=90° 직각삼각형 (AC:BC = 4:3 으로 그림)
  r1: `<svg class="fig" viewBox="0 0 250 180"><path class="ln" d="M50 150 L210 150 L210 30 Z"/>
    <path class="aux" d="M198 150 L198 138 L210 138"/><path class="aux" d="M78 150 A28 28 0 0 0 72 133"/>
    <text x="34" y="168">A</text><text x="214" y="168">C</text><text x="214" y="26">B</text></svg>`,
  // 방2 특수각 삼각형 두 개
  r2a: `<svg class="fig" viewBox="0 0 240 150"><path class="ln" d="M30 120 L200 120 L200 22 Z"/>
    <path class="aux" d="M188 120 L188 108 L200 108"/>
    <text x="54" y="114" font-size="13">30°</text><text x="170" y="46" font-size="13">60°</text>
    <text x="104" y="142" font-size="15">√3</text><text x="208" y="76" font-size="15">1</text><text x="96" y="62" font-size="15">2</text></svg>`,
  r2b: `<svg class="fig" viewBox="0 0 240 150"><path class="ln" d="M60 125 L170 125 L170 15 Z"/>
    <path class="aux" d="M158 125 L158 113 L170 113"/>
    <text x="80" y="119" font-size="13">45°</text><text x="138" y="54" font-size="13">45°</text>
    <text x="110" y="145" font-size="15">1</text><text x="178" y="74" font-size="15">1</text><text x="92" y="64" font-size="15">√2</text></svg>`,
  // 방3 급수탑 올려보기
  r3: `<svg class="fig" viewBox="0 0 280 180"><path class="ln" d="M10 160 L270 160"/>
    <path class="ln" d="M40 160 L40 128"/><circle class="dot" cx="40" cy="124" r="5"/>
    <path class="ln" d="M226 160 L226 34 L254 34 L254 160"/><path class="ln" d="M222 34 L240 14 L258 34"/>
    <path class="aux" d="M44 124 L226 124"/><path class="hl" d="M44 124 L226 34"/>
    <path class="aux" d="M84 124 A40 40 0 0 0 80 106"/><text x="90" y="118" font-size="13">45°</text>
    <text x="22" y="177" font-size="12">사람</text><text x="216" y="177" font-size="12">급수탑</text></svg>`,
  // 방4 ∠A가 둔각인 삼각형
  r4: `<svg class="fig" viewBox="0 0 270 170"><path class="ln" d="M20 140 L250 140 L100 104 Z"/>
    <path class="aux" d="M84 108 A18 18 0 0 0 118 108"/>
    <text x="94" y="96">A</text><text x="6" y="158">B</text><text x="252" y="158">C</text></svg>`,
  // 도전 ∠B가 둔각인 평행사변형
  rb: `<svg class="fig" viewBox="0 0 280 170"><path class="ln" d="M20 60 L60 140 L260 140 L220 60 Z"/>
    <path class="aux" d="M50 120 A22 22 0 0 0 82 140"/>
    <text x="6" y="56">A</text><text x="48" y="160">B</text><text x="262" y="160">C</text><text x="222" y="54">D</text></svg>`
};
const STAGES = [
  { title:'첫 번째 문 · 3학년 2반 교실', scene:'cls', letter:'각', unit:'',
    story:'불 꺼진 3학년 2반. 칠판에 직각삼각형이 그려져 있고, 그 옆에 누군가 붉은 분필로 "tan A"라고 적어 놓았다. 교실 문은 안에서 잠겨 있다.',
    q:'빗변 AB의 길이는?',
    trapNames:{ac:'빗변 대신 AC를 답함', bc:'BC를 답으로 씀'},
    make(r){ const [p,q,h,m]=pick(r,[[3,4,5,2],[3,4,5,3],[5,12,13,1]]);
      const BC=p*m, AC=q*m, AB=h*m;
      return { ans:{n:AB}, traps:[{id:'ac',v:AC},{id:'bc',v:BC}],
        cards:[
          {tag:'칠판의 그림', body:'∠C = 90°인 직각삼각형 ABC<br><span class="small dim">그림은 실제 크기와 다를 수 있다.</span>', fig:'r1'},
          {tag:'칠판 구석의 낙서', body:`tan A = ${p}/${q}`},
          {tag:'책상 속 쪽지', body:`BC = ${BC}`},
          {tag:'찢어진 교과서 한 쪽', body:'직각삼각형에서<br>(빗변)² = (나머지 두 변의 제곱의 합)'},
          {tag:'분필로 쓴 메모', body:'삼각비는 어느 각을 기준으로 보느냐에 따라 달라진다.'}],
        hints:['tan A는 ∠A의 맞은편 변 BC를, ∠A 옆의 변 AC로 나눈 값입니다.',
               `BC : AC = ${p} : ${q}이고 BC = ${BC}이므로 AC = ${AC}. 피타고라스 정리로 AB를 구하세요.`],
        explain:`<b>풀이</b> tan A = BC/AC = ${p}/${q}, BC = ${BC}이므로 AC = ${AC}. AB² = ${AC}² + ${BC}² = ${AB*AB} → AB = ${AB}` }; } },

  { title:'두 번째 문 · 과학실', scene:'sci', letter:'삼', unit:'',
    story:'과학실 칠판에 알 수 없는 식이 적혀 있다. 비커 두 개에 삼각형 라벨이 붙어 있고, 표본 병 속에서 무언가 움직인 것 같다.',
    trapNames:{t30:'tan 30°를 √3으로 착각'},
    make(r){ const k=pick(r,[2,4,6]), ans=1+k/2;
      return { q:`(sin 60° ÷ cos 60°) × tan 30° + ${k} cos 60° 의 값은?`, ans:{n:ans}, traps:[{id:'t30',v:3+k/2}],
        cards:[
          {tag:'1번 비커 라벨', body:'세 각이 30°, 60°, 90°인 삼각형', fig:'r2a'},
          {tag:'2번 비커 라벨', body:'세 각이 45°, 45°, 90°인 삼각형', fig:'r2b'},
          {tag:'실험 노트', body:'tan A = sin A ÷ cos A'},
          {tag:'칠판 구석의 낙서', body:'√3 × √3 = 3'},
          {tag:'과학 선생님 메모', body:'특수각의 삼각비는 삼각형 그림에서 바로 읽을 수 있다.'}],
        hints:['sin 60° ÷ cos 60° = tan 60° = √3 입니다. tan 30°는 1번 비커에서 30°의 맞은편 변 ÷ 옆의 변 = 1/√3 입니다.',
               `√3 × (1/√3) = 1, ${k} cos 60° = ${k} × 1/2 = ${k/2}`],
        explain:`<b>풀이</b> sin 60° ÷ cos 60° = tan 60° = √3, tan 30° = √3/3 → √3 × √3/3 = 1. ${k} cos 60° = ${k/2}. 합은 ${ans}` }; } },

  { title:'세 번째 문 · 도서실', scene:'lib', letter:'량', unit:'m',
    story:'도서실 창밖으로 운동장 끝 낡은 급수탑이 보인다. 탑 꼭대기에서 무언가 반짝인다. 탑의 높이를 알아내야 문이 열린다.',
    q:'급수탑의 높이는 몇 m일까?',
    trapNames:{eye:'눈높이를 더하지 않음'},
    make(r){ const d=randInt(r,40,60), e=pick(r,[1.4,1.5,1.6]), ans=Math.round((d+e)*10)/10;
      return { ans:{n:ans}, traps:[{id:'eye',v:d}],
        cards:[
          {tag:'창밖 스케치', body:'눈높이에서 수평으로 본 선과 탑 꼭대기를 본 선<br><span class="small dim">그림은 실제 크기와 다를 수 있다.</span>', fig:'r3'},
          {tag:'사서 선생님의 메모', body:`바닥에서 눈까지 높이 ${e} m`},
          {tag:'대출 카드', body:`서 있는 곳에서 탑까지 수평거리 ${d} m`},
          {tag:'책갈피 메모', body:'탑 꼭대기를 올려본각 45°'},
          {tag:'반납함 쪽지', body:'tan 45° = 1'}],
        hints:['tan 45° = 1이므로 눈높이보다 위쪽 부분의 높이는 수평거리와 같습니다.',
               `${d} m는 눈높이 위쪽만의 높이입니다. 눈높이 ${e} m를 더하세요.`],
        explain:`<b>풀이</b> 눈높이 위쪽 높이 = ${d} × tan 45° = ${d} m. 여기에 눈높이 ${e} m를 더해 ${ans} m` }; } },

  { title:'네 번째 문 · 교무실', scene:'off', letter:'측', unit:'',
    story:'교무실 벽에 둔각삼각형 모양의 게시판이 걸려 있다. 게시판의 넓이를 적어 넣으면 열쇠 서랍이 열린다고 쓰여 있다.',
    q:'게시판(△ABC)의 넓이는?',
    trapNames:{nosin:'sin을 빼고 ½ab로 계산'},
    make(r){ const [a,b]=pick(r,[[8,8],[8,10],[8,12],[10,10],[10,12],[12,12]]), ans=a*b/4;
      return { ans:{n:ans}, traps:[{id:'nosin',v:a*b/2}],
        cards:[
          {tag:'게시판 그림', body:'∠A가 둔각인 삼각형 ABC', fig:'r4'},
          {tag:'출석부 ①', body:`AB = ${a}`},
          {tag:'출석부 ②', body:`AC = ${b}`},
          {tag:'출석부 ③', body:'∠A = 150°'},
          {tag:'교사용 지도서', body:'두 변의 길이 a, b와 끼인각 θ를 알 때<br>넓이 = ½ × a × b × sin θ<br>θ가 둔각이면 sin(180° − θ)를 쓴다.'}],
        hints:['끼인각이 150°로 둔각이므로 sin(180° − 150°) = sin 30° = 1/2 을 씁니다.',
               `½ × ${a} × ${b} × ½`],
        explain:`<b>풀이</b> 넓이 = ½ × ${a} × ${b} × sin(180° − 150°) = ½ × ${a} × ${b} × ½ = ${ans}` }; } },

  { title:'마지막 금고 · 교장실', vault:true, scene:'vlt',
    story:'교장실 구석에 네 칸짜리 글자 자물쇠가 달린 금고가 있다. 정문 열쇠가 이 안에 있다. 문 밖 복도에서 발소리가 점점 가까워진다.',
    q:'금고의 네 글자 암호는?', word:'삼각측량', traps:[{id:'order',v:'각삼량측'}], trapNames:{order:'얻은 순서대로 읽음'},
    clue:'열쇠 숫자가 작은 문에서 얻은 글자부터 차례로 읽어라.<br><span class="small dim">열쇠 숫자는 그 문을 열 때 입력한 답이다.</span>',
    hints:['글자를 얻은 순서대로 읽으면 뜻이 없습니다. 글자 아래의 열쇠 숫자를 비교하세요.',
           '열쇠 숫자를 작은 것부터 놓아 보세요. 2번째 문 → 1번째 문 → 4번째 문 → 3번째 문 순서가 됩니다.'],
    explain:'<b>풀이</b> 열쇠 숫자가 작은 순서: 2번째 문(삼) · 1번째 문(각) · 4번째 문(측) · 3번째 문(량) → <b>삼각측량</b>. 직접 잴 수 없는 높이와 거리를 삼각비로 구하는 방법입니다.' },

  { title:'도전 방 · 지하 창고', bonus:true, scene:'bsm', unit:'',
    story:'정문 옆, 지하 창고로 내려가는 계단이 있다. 탈출한 사람만 내려갈 수 있다. 백열전구 아래 바닥에 평행사변형이 그려져 있다.',
    q:'평행사변형 ABCD의 넓이는?',
    make(r){ const a=pick(r,[6,8,10]), b=pick(r,[10,12,14]);
      return { ans:{n:a*b/2},
        cards:[
          {tag:'바닥의 그림', body:'∠B가 둔각인 평행사변형', fig:'rb'},
          {tag:'벽의 낙서 ①', body:'□ABCD는 평행사변형'},
          {tag:'벽의 낙서 ②', body:`AB = ${a}`},
          {tag:'벽의 낙서 ③', body:`BC = ${b}`},
          {tag:'벽의 낙서 ④', body:'∠B = 150°'}],
        hints:['평행사변형의 넓이 = (이웃한 두 변의 곱) × sin(끼인각). 삼각형 넓이의 두 배입니다.',
               `∠B가 둔각이므로 sin(180° − 150°) = sin 30°를 씁니다. ${a} × ${b} × ½`],
        explain:`<b>풀이</b> 넓이 = ${a} × ${b} × sin(180° − 150°) = ${a*b} × ½ = ${a*b/2}` }; } }
];
</script>
