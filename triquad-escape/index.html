<script>
/* ===== 이 게임의 설정과 문제 — 엔진(../engine/escape.js)은 모든 게임이 함께 씁니다 ===== */
const GAME = {
  id:'triquad', title:'진해중 폐교 탈출', subtitle:'삼각형과 사각형 편',
  intro:'오래전 문을 닫은 옛 진해중학교 건물. 정신을 차리니 정문이 잠겨 있다. 삼각형과 사각형의 성질로 잠긴 문 네 개를 열고, 교장실 금고에서 정문 열쇠를 찾아 탈출하라. 한 사람씩 도전하는 개인전이다. 학생마다 숫자가 다르다.',
  classLabel:'2학년 3반', roomExample:'2학년 3반 삼각형', lockMs:20000
};
/* 무작위 범위 설계 — 금고 암호(정사각형)를 지키기 위해 정답 범위가 겹치지 않게 했습니다
   2번 문 3·4·6  <  4번 문 8~11  <  1번 문 12~60  <  3번 문 110~140 */
const F = {
  // 방1 이등변삼각형 두 번 (AB=AC, BD=BC) — D의 위치는 실제로 계산한 좌표
  r1: `<svg class="fig" viewBox="0 0 250 200"><path class="ln" d="M125 15 L55 185 L195 185 Z"/>
    <path class="hl" d="M55 185 L154 86"/><circle class="dot" cx="154" cy="86" r="3.5"/>
    <text x="119" y="11">A</text><text x="40" y="198">B</text><text x="198" y="198">C</text><text x="160" y="84">D</text></svg>`,
  // 방2 직각삼각형과 각의 이등분선 (AC:BC=6:8, DE⊥AB 정확)
  r2: `<svg class="fig" viewBox="0 0 270 195"><path class="ln" d="M40 20 L40 170 L240 170 Z"/>
    <path class="hl" d="M40 20 L115 170"/><path class="hl" d="M115 170 L160 110"/>
    <path class="aux" d="M40 158 L52 158 L52 170"/><path class="aux" d="M150 102 L143 112 L153 118"/>
    <text x="26" y="18">A</text><text x="24" y="186">C</text><text x="244" y="186">B</text><text x="110" y="188">D</text><text x="164" y="104">E</text></svg>`,
  // 방3 세 내각의 이등분선이 만나는 점 P
  r3: `<svg class="fig" viewBox="0 0 260 200"><path class="ln" d="M120 20 L20 180 L240 180 Z"/>
    <path class="aux" d="M120 20 L124 122"/><path class="hl" d="M20 180 L124 122 L240 180"/>
    <circle class="dot" cx="124" cy="122" r="3.5"/>
    <text x="114" y="14">A</text><text x="6" y="194">B</text><text x="242" y="194">C</text><text x="130" y="116">P</text></svg>`,
  // 방4 평행사변형과 각의 이등분선 (BE=AB가 되도록 그림)
  r4: `<svg class="fig" viewBox="0 0 300 190"><path class="ln" d="M80 66 L20 170 L220 170 L280 66 Z"/>
    <path class="hl" d="M80 66 L140 170"/><circle class="dot" cx="140" cy="170" r="3.5"/>
    <text x="72" y="58">A</text><text x="6" y="184">B</text><text x="224" y="184">C</text><text x="284" y="60">D</text><text x="134" y="186">E</text></svg>`,
  // 도전 평행사변형 안의 한 점
  rb: `<svg class="fig" viewBox="0 0 300 190"><path class="ln" d="M60 40 L20 170 L240 170 L280 40 Z"/>
    <path class="aux" d="M150 105 L60 40 M150 105 L20 170 M150 105 L240 170 M150 105 L280 40"/>
    <circle class="dot" cx="150" cy="105" r="3.5"/>
    <text x="52" y="32">A</text><text x="6" y="184">B</text><text x="244" y="184">C</text><text x="284" y="34">D</text><text x="156" y="100">P</text></svg>`
};
const STAGES = [
  { title:'첫 번째 문 · 2학년 3반 교실', scene:'cls', letter:'각', unit:'°',
    story:'복도 끝 2학년 3반. 칠판에 누군가 붉은 분필로 삼각형 두 개를 겹쳐 그려 놓았다. 각 하나가 지워져 있고, 교실 문은 안에서 잠겨 있다.',
    q:'∠ABD의 크기는 몇 도일까?',
    trapNames:{dbc:'∠DBC를 답으로 씀', abc:'∠ABC를 답으로 씀'},
    make(r){ const a=pick(r,[20,22,24,26,28,30,32,34,38,40,42,44,46,48,50,52]);   // 36은 함정과 정답이 같아져서 뺌
      const C=(180-a)/2, ans=90-1.5*a;
      return { ans:{n:ans}, traps:[{id:'dbc',v:a},{id:'abc',v:C}],
        cards:[
          {tag:'칠판의 그림', body:'점 D는 변 AC 위의 점이다.<br><span class="small dim">그림은 실제 크기와 다를 수 있다.</span>', fig:'r1'},
          {tag:'칠판 구석의 낙서', body:'AB = AC'},
          {tag:'책상 속 쪽지', body:'BD = BC'},
          {tag:'분필로 쓴 숫자', body:`∠A = ${a}°`},
          {tag:'찢어진 교과서 한 쪽', body:'이등변삼각형에서 길이가 같은 두 변의 맞은편에 있는 두 각의 크기는 같다.'}],
        hints:['BD = BC이므로 △BDC도 이등변삼각형입니다. 크기가 같은 두 각은 ∠DBC가 아니라 ∠BDC와 ∠BCD입니다.',
               `∠C = ${C}°이므로 ∠BDC = ${C}°, ∠DBC = ${a}°입니다. ∠ABC에서 ∠DBC를 빼 보세요.`],
        explain:`<b>풀이</b> ∠ABC = ∠C = (180° − ${a}°) ÷ 2 = ${C}°. △BDC에서 ∠BDC = ∠BCD = ${C}°이므로 ∠DBC = ${a}°. ∠ABD = ${C}° − ${a}° = ${ans}°` }; } },

  { title:'두 번째 문 · 과학실', scene:'sci', letter:'정', unit:'', cond:true,
    condLabel:'합동 조건', condOpts:['RHA','RHS','SAS'], numLabel:'선분 CD의 길이',
    story:'과학실 선반 하나가 벽에 기대어 직각삼각형 모양으로 쓰러져 있다. 누군가 꼭짓점 A에서 선을 그어 각을 똑같이 나눠 놓았다. 표본 병 속에서 무언가 움직인 것 같다.',
    q:'△ACD와 △AED는 합동이다. 합동 조건과 선분 CD의 길이는?',
    trapNames:{mid:'D를 BC의 중점으로 착각'},
    make(r){ const [AC,BC,AB]=pick(r,[[6,8,10],[12,9,15],[12,16,20]]);
      const x=AC*BC/(AC+AB);
      return { ans:{cond:'RHA',n:x}, traps:[{id:'mid',v:BC/2}],
        cards:[
          {tag:'쓰러진 선반', body:'D는 변 BC 위, E는 변 AB 위의 점이다.<br><span class="small dim">그림은 실제 크기와 다를 수 있다.</span>', fig:'r2'},
          {tag:'실험 노트 ①', body:'∠C = 90°<br>DE ⊥ AB'},
          {tag:'실험 노트 ②', body:'AD는 ∠A의 이등분선'},
          {tag:'실험 노트 ③', body:`AC = ${AC}<br>AB = ${AB}`},
          {tag:'실험 노트 ④', body:`BC = ${BC}`}],
        hints:['두 삼각형은 빗변 AD를 함께 쓰고, ∠CAD = ∠EAD 입니다. 빗변과 한 예각이 같습니다.',
               `CD = DE = x라 두면, △ABC의 넓이 = △ACD + △ABD 입니다. ½ × ${AC} × x + ½ × ${AB} × x = ½ × ${AC} × ${BC}`],
        explain:`<b>풀이</b> 빗변 AD 공통, ∠CAD = ∠EAD → RHA 합동이므로 CD = DE = x. ${AC/2}x + ${AB/2}x = ${AC*BC/2} → x = ${x}` }; } },

  { title:'세 번째 문 · 도서실', scene:'lib', letter:'형', unit:'°',
    story:'불 꺼진 도서실. 천장에 삼각형 문양이 있고, 세 꼭짓점에서 뻗은 선이 한 점에서 만난다. 아무도 없는 서가 사이에서 책장 넘기는 소리가 들린다.',
    q:'∠BPC의 크기는 몇 도일까?',
    trapNames:{circ:'외심 공식(2∠A)을 씀'},
    make(r){ const b=pick(r,[40,44,48,52,56,64,68,72,76,80,84,88,92,96,100]);   // 60은 함정과 정답이 같아져서 뺌
      const ans=90+b/2;
      return { ans:{n:ans}, traps:[{id:'circ',v:2*b}],
        cards:[
          {tag:'천장의 문양', body:'삼각형 안의 점 P', fig:'r3'},
          {tag:'대출 카드', body:'점 P는 △ABC의 세 내각의 이등분선의 교점이다.'},
          {tag:'책갈피 메모', body:`∠BAC = ${b}°`},
          {tag:'반납함 쪽지', body:'∠PBA = ∠PBC<br>∠PCA = ∠PCB'},
          {tag:'사서 선생님의 메모', body:'삼각형의 세 내각의 크기의 합은 180°'}],
        hints:['세 내각의 이등분선이 만나는 점은 외심이 아니라 내심입니다.',
               `∠PBC + ∠PCB = ½ × (∠B + ∠C) = ½ × (180° − ${b}°)`],
        explain:`<b>풀이</b> ∠B + ∠C = ${180-b}°이므로 ∠PBC + ∠PCB = ${(180-b)/2}°. ∠BPC = 180° − ${(180-b)/2}° = ${ans}°. (내심은 ∠BPC = 90° + ½∠A)` }; } },

  { title:'네 번째 문 · 교무실', scene:'off', letter:'사', unit:'',
    story:'교무실 창문이 평행사변형으로 비틀려 있다. 꼭짓점 A에서 그은 붉은 선이 아랫변과 만난다. 책상 위에 누군가의 출석부가 펼쳐져 있다.',
    q:'선분 EC의 길이는?',
    trapNames:{mid:'E를 BC의 중점으로 착각', be:'BE를 답으로 씀'},
    make(r){ const AB=randInt(r,4,7), EC=randInt(r,8,11), AD=AB+EC;
      return { ans:{n:EC}, traps:[{id:'mid',v:AD/2},{id:'be',v:AB}],
        cards:[
          {tag:'비틀린 창문', body:'점 E는 변 BC 위의 점이다.<br><span class="small dim">그림은 실제 크기와 다를 수 있다.</span>', fig:'r4'},
          {tag:'출석부 ①', body:'□ABCD는 평행사변형이다.'},
          {tag:'출석부 ②', body:'AE는 ∠A의 이등분선'},
          {tag:'출석부 ③', body:`AB = ${AB}`},
          {tag:'출석부 ④', body:`AD = ${AD}`}],
        hints:['AD ∥ BC이므로 ∠DAE와 ∠AEB는 엇각으로 크기가 같습니다.',
               '△ABE는 BA = BE인 이등변삼각형입니다. EC = BC − BE'],
        explain:`<b>풀이</b> ∠BAE = ∠DAE = ∠AEB(엇각) → △ABE는 이등변삼각형, BE = AB = ${AB}. BC = AD = ${AD}이므로 EC = ${AD} − ${AB} = ${EC}` }; } },

  { title:'마지막 금고 · 교장실', vault:true, scene:'vlt',
    story:'교장실 구석에 네 칸짜리 글자 자물쇠가 달린 금고가 있다. 정문 열쇠가 이 안에 있다. 문 밖 복도에서 발소리가 점점 가까워진다.',
    q:'금고의 네 글자 암호는?', word:'정사각형', traps:[{id:'order',v:'각정형사'}], trapNames:{order:'얻은 순서대로 읽음'},
    clue:'열쇠 숫자가 작은 문에서 얻은 글자부터 차례로 읽어라.<br><span class="small dim">열쇠 숫자는 그 문을 열 때 입력한 답이다.</span>',
    hints:['글자를 얻은 순서대로 읽으면 뜻이 없습니다. 글자 아래의 열쇠 숫자를 비교하세요.',
           '열쇠 숫자를 작은 것부터 놓아 보세요. 2번째 문 → 4번째 문 → 1번째 문 → 3번째 문 순서가 됩니다.'],
    explain:'<b>풀이</b> 열쇠 숫자가 작은 순서: 2번째 문(정) · 4번째 문(사) · 1번째 문(각) · 3번째 문(형) → <b>정사각형</b>. 네 변의 길이와 네 각의 크기가 모두 같은 사각형입니다.' },

  { title:'도전 방 · 지하 창고', bonus:true, scene:'bsm', unit:'',
    story:'정문 옆, 지하 창고로 내려가는 계단이 있다. 탈출한 사람만 내려갈 수 있다. 백열전구 아래 바닥에 평행사변형이 그려져 있다.',
    q:'△PCD의 넓이는?',
    make(r){ const T=pick(r,[40,48,56,60,72,80]), h=T/2, x=randInt(r,Math.ceil(h*0.25),Math.floor(h*0.75)), y=randInt(r,Math.ceil(h*0.25),Math.floor(h*0.75));
      return { ans:{n:h-x},
        cards:[
          {tag:'바닥의 그림', body:'평행사변형 안의 한 점 P', fig:'rb'},
          {tag:'벽의 낙서 ①', body:`□ABCD는 평행사변형이고 넓이는 ${T}`},
          {tag:'벽의 낙서 ②', body:'점 P는 평행사변형 내부의 한 점'},
          {tag:'벽의 낙서 ③', body:`△PAB의 넓이 = ${x}`},
          {tag:'벽의 낙서 ④', body:`△PBC의 넓이 = ${y}`}],
        hints:['△PAB와 △PCD는 밑변의 길이가 같고(AB = CD), 두 높이의 합은 평행사변형의 높이입니다.',
               '△PAB + △PCD = 평행사변형 넓이의 절반'],
        explain:`<b>풀이</b> △PAB + △PCD = ½ × ${T} = ${h}이므로 △PCD = ${h} − ${x} = ${h-x}. △PBC의 넓이는 필요 없는 정보였습니다.` }; } }
];
</script>
