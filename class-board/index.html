<script>
/* ── 저장소 : Firebase 또는 로컬 ───────────────────────────── */
function loadScript(src){return new Promise((ok,no)=>{if([...document.scripts].some(s=>s.src===src))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function makeFirebaseStore(cfg){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  firebase.initializeApp(cfg);
  const db=firebase.database(); let off=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{off=s.val()||0});
  return {local:false, now:()=>Date.now()+off,
    on(p,cb){const r=db.ref(p);const h=r.on('value',s=>cb(s.val()));return()=>r.off('value',h)},
    async once(p){return (await db.ref(p).once('value')).val()},
    set:(p,v)=>db.ref(p).set(v), update:(p,o)=>db.ref(p).update(o)};
}
function makeLocalStore(key){
  const KEY=key||'mathboard_local';
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
  const write=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){} fire()};
  const get=(o,p)=>p.split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k],o);
  const put=(o,p,v)=>{const ks=p.split('/').filter(Boolean);let c=o;ks.slice(0,-1).forEach(k=>{if(typeof c[k]!=='object'||c[k]===null)c[k]={};c=c[k]});
    if(v===null||v===undefined)delete c[ks[ks.length-1]];else c[ks[ks.length-1]]=v};
  const subs=new Set();
  function fire(){const d=read();subs.forEach(s=>{const v=get(d,s.p);const j=JSON.stringify(v===undefined?null:v);if(j!==s.last){s.last=j;s.cb(JSON.parse(j))}})}
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  return {local:true, now:()=>Date.now(),
    on(p,cb){const s={p,cb,last:undefined};subs.add(s);setTimeout(fire,0);return()=>subs.delete(s)},
    async once(p){return get(read(),p)??null},
    set(p,v){const d=read();put(d,p,v);write(d)},
    update(p,o){const d=read();Object.entries(o).forEach(([k,v])=>put(d,p+'/'+k,v));write(d)}};
}
let S=null;
async function initStore(){
  if(S)return S;
  try{ if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey){ S=await makeFirebaseStore(FIREBASE_CONFIG); } }catch(e){ console.warn('firebase 실패 → 로컬',e); }
  if(!S)S=makeLocalStore();
  document.getElementById('mode').textContent=S.local?'로컬 모드 (같은 브라우저끼리)':'';
  return S;
}

/* ── 차시 목록 ───────────────────────────────────────────── */
const TEACH_PIN='2026';                 // 교사 화면 잠금 (바꾸려면 여기만 고치세요)
const CLASSES=[1,2];
const GROUPS=[1,2,3,4,5];        // 1·2반 모두 5모둠 (2026-09-28)
const NCH={1:'①',2:'②',3:'③',4:'④',5:'⑤'};
const SCRIBE=3;                  // 기기를 가진 사람은 ③ 기록이 한 명뿐
const ROLE={1:'이끔이',2:'점검이',3:'기록이',4:'발표이',5:'연결이'};
const RAD={1:[2,3],2:[4,6],3:[6,9],4:[8,12],5:[10,15]};

const LESSONS={
  33:{ no:33, name:'닮은 도형', book:'교과서 193~196쪽', ready:true, stages:[
    { key:'s1', tab:'① 함께하기', title:'함께하기 — 세 쌍의 대응변의 비',
      lead:'모눈 칸수를 세어 구한 세 비와 대응각 비교를 ③ 기록이가 올립니다.',
      fields:[ {k:'ab',lab:'AB : DE',ph:'1:2',who:1,kind:'ratio',ans:'1:2'},
               {k:'bc',lab:'BC : EF',ph:'1:2',who:2,kind:'ratio',ans:'1:2'},
               {k:'ca',lab:'CA : FD',ph:'1:2',who:3,kind:'ratio',ans:'1:2'},
               {k:'ang',lab:'대응각 세 쌍',ph:'=',who:4,kind:'pick',opts:['=','≠'],ans:'='} ],
      concl:'세 비가 모두 1 : 2 로 같습니다.  대응변의 길이의 비 — 닮음비 — 는 일정합니다.' },
    { key:'s2', tab:'② 두 원', title:'두 원의 닮음비',
      lead:'모둠마다 반지름이 다릅니다. 간단한 자연수 비로 고쳐 ③ 기록이가 올립니다.',
      fields:[ {k:'rr',lab:'우리 모둠 닮음비',ph:'2:3',who:5,kind:'ratio',ans:'2:3'} ],
      extra:g=>'반지름 '+RAD[g][0]+' cm , '+RAD[g][1]+' cm',
      concl:'반지름이 모둠마다 다른데 닮음비는 모두 2 : 3.  비는 크기가 아니라 관계입니다.' },
    { key:'s3', tab:'③ 문제 2', title:'문제 2 — □ABCD ∽ □EFGH',
      lead:'④ 가 검산한 뒤 ③ 기록이가 올립니다.',
      fields:[ {k:'q1',lab:'⑴ 닮음비',ph:'4:3',who:1,kind:'ratio',ans:'4:3'},
               {k:'q2',lab:'⑵ GH (cm)',ph:'6',who:2,kind:'num',ans:'6'},
               {k:'q3',lab:'⑶ ∠H (도)',ph:'118',who:5,kind:'num',ans:'118'} ],
      concl:'닮음비 4 : 3 ,  GH = 6 cm ,  ∠H = 118°' }
  ]},
  34:{ no:34, name:'닮음비와 넓이의 비', book:'교과서 197~198쪽', ready:false },
  35:{ no:35, name:'입체도형의 닮음과 부피의 비', book:'교과서 199쪽', ready:false }
};
const normRatio=v=>String(v||'').replace(/\s|대/g,':').replace(/:+/g,':').replace(/^:|:$/g,'');
const normNum=v=>String(v||'').replace(/[^\d.\-]/g,'');
function norm(f,v){return f.kind==='ratio'?normRatio(v):f.kind==='num'?normNum(v):String(v||'').trim()}
function correct(f,v){return norm(f,v)===f.ans}
const roomPath=(cls,no)=>'rooms/'+(cls*1000+no*10);   // 1반 33차시 → 1330 · 2반 33차시 → 2330

/* ── 화면 ────────────────────────────────────────────────── */
const V=document.getElementById('view');
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let unsubs=[]; function clearView(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];V.innerHTML='';}
function crumb(t){document.getElementById('crumb').textContent=t||'진해중 2학년'}
function showHome(b){document.getElementById('home').classList.toggle('hide',!b)}
document.getElementById('home').onclick=()=>{location.href=location.pathname};
const go=q=>{location.search=q};

/* 차시 고르기 (QR 로 들어오면 첫 화면) */
function viewLessons(){
  clearView(); showHome(false); crumb('진해중 2학년');
  const list=Object.values(LESSONS).map(L=>`
    <button class="lesson" data-no="${L.no}" ${L.ready?'':'disabled'}>
      <b>${L.no}차시</b>
      <span>${esc(L.name)}</span>
      <em>${L.ready?esc(L.book):'준비 중'}</em>
    </button>`).join('');
  V.append($(`<div class="card">
    <h2>오늘 할 차시를 누르세요</h2>
    <p class="d">기기는 <b>모둠에 한 대</b>, <b>③ 기록이</b>만 씁니다. 누르면 우리 반과 모둠을 고르는 화면이 나옵니다. 이 주소는 앞으로 계속 씁니다.</p>
    <div class="lessons">${list}</div>
  </div>`));
  V.append($(`<div style="text-align:center"><button class="btn sm" id="tb">교사 화면</button></div>`));
  V.querySelectorAll('.lesson[data-no]').forEach(b=>b.onclick=()=>go('?l='+b.dataset.no));
  document.getElementById('tb').onclick=()=>go('?t=1');
}

/* 학생 : 반 → 모둠 → 번호 */
function viewSeat(no){
  const L=LESSONS[no]; if(!L||!L.ready)return viewLessons();
  clearView(); showHome(true); crumb(no+'차시 · '+L.name);
  const saved=JSON.parse(localStorage.getItem('mb_me_'+no)||'null');
  if(saved){saved.n=SCRIBE;return viewStudent(no,saved);}
  let cls=null,g=null;
  const c=$(`<div class="card">
    <h2>${no}차시 · ${esc(L.name)}</h2>
    <div class="msg g"><b>${NCH[SCRIBE]} 기록이</b> 한 명만 들어옵니다. 모둠에 기기는 한 대뿐입니다.</div>
    <p class="d">우리 반과 모둠을 고르세요. 한 번 고르면 다음 차시부터는 바로 들어옵니다.</p>
    <label>반</label>
    <div class="pick" id="pc">${CLASSES.map(x=>`<button data-c="${x}">${x}반</button>`).join('')}</div>
    <label style="margin-top:14px">모둠</label>
    <div class="pick" id="pg">${GROUPS.map(x=>`<button data-g="${x}">${x}모둠</button>`).join('')}</div>
    <div style="margin-top:16px"><button class="btn p" id="ok" disabled>들어가기</button></div>
  </div>`);
  V.append(c);
  const ok=c.querySelector('#ok'), upd=()=>ok.disabled=!(cls&&g);
  const sel=(box,b)=>box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  c.querySelectorAll('#pc button').forEach(b=>b.onclick=()=>{cls=+b.dataset.c;sel(c.querySelector('#pc'),b);upd()});
  c.querySelectorAll('#pg button').forEach(b=>b.onclick=()=>{g=+b.dataset.g;sel(c.querySelector('#pg'),b);upd()});
  ok.onclick=()=>{const me={cls,g,n:SCRIBE};localStorage.setItem('mb_me_'+no,JSON.stringify(me));viewStudent(no,me)};
}

async function viewStudent(no,me){
  const L=LESSONS[no];
  clearView(); showHome(true); crumb(no+'차시 · '+L.name);
  const s=await initStore(); const R=roomPath(me.cls,no);
  const head=$(`<div class="card" style="padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span class="nb nb${me.n}">${NCH[me.n]}</span>
    <b>${me.cls}반 ${me.g}모둠 · ${ROLE[me.n]}</b>
    <span style="margin-left:auto"></span>
    <button class="btn sm" id="chg">바꾸기</button></div>`);
  V.append(head);
  head.querySelector('#chg').onclick=()=>{localStorage.removeItem('mb_me_'+no);viewSeat(no)};
  const body=$('<div></div>'); V.append(body);
  const paint=room=>{
    const stage=(room&&room.meta&&room.meta.stage)||0;
    const st=L.stages[stage];
    const mine=(room&&room.groups&&room.groups[me.g]&&room.groups[me.g][st.key])||{};
    const canPost=me.n===SCRIBE;
    body.innerHTML=`<div class="card">
      <h2>${esc(st.title)}</h2>
      <p class="d">${esc(st.lead)}</p>
      ${st.extra?`<div class="msg g">우리 모둠 ${esc(st.extra(me.g))}</div>`:''}
      ${st.fields.map(f=>`<div style="margin-bottom:12px">
        <label>${esc(f.lab)} <span class="nb nb${f.who}" style="min-width:22px;height:20px;font-size:12px">${NCH[f.who]}</span></label>
        ${f.kind==='pick'
          ?`<div class="pick" data-k="${f.k}">${f.opts.map(o=>`<button data-v="${o}" ${mine[f.k]===o?'aria-pressed="true"':''}>${o}</button>`).join('')}</div>`
          :`<input data-k="${f.k}" value="${esc(mine[f.k]||'')}" placeholder="${esc(f.ph)}" ${canPost?'':'disabled'}>`}
      </div>`).join('')}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn p" id="send" ${canPost?'':'disabled'}>우리 모둠 값 올리기</button>
        <button class="btn" id="hand">도움 요청</button>
      </div>
      ${canPost?'':'<div class="note">올리는 사람은 ③ 기록이입니다.</div>'}
      ${mine.at?'<div class="msg g">올렸습니다 — 선생님 화면에서 함께 봅니다.</div>':''}
    </div>`;
    body.querySelectorAll('.pick[data-k] button').forEach(b=>b.onclick=()=>{
      b.closest('.pick').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
    body.querySelector('#send').onclick=async()=>{
      const o={by:NCH[me.n],at:s.now()};
      st.fields.forEach(f=>{
        if(f.kind==='pick'){const x=body.querySelector(`.pick[data-k="${f.k}"] button[aria-pressed="true"]`);o[f.k]=x?x.dataset.v:''}
        else{const el=body.querySelector(`input[data-k="${f.k}"]`);o[f.k]=norm(f,el?el.value:'')}});
      if(st.fields.some(f=>!o[f.k]))return alert('빈 칸이 있습니다.');
      await s.set(R+'/groups/'+me.g+'/'+st.key,o);
    };
    body.querySelector('#hand').onclick=async()=>{
      const m=prompt('어디서 막혔나요?  (예 : 문제 2 ⑶)'); if(m===null)return;
      await s.set(R+'/help/'+me.g,{msg:m.slice(0,40),at:s.now()});
    };
  };
  unsubs.push(s.on(R,paint));
}

/* 교사 */
function viewTeacherGate(){
  clearView(); showHome(true); crumb('교사 화면');
  V.append($(`<div class="card">
    <h2>교사 화면</h2>
    <p class="d">학생이 실수로 지우지 않도록 잠가 두었습니다. 열면 <b>반 → 차시</b> 를 고르고, 그 화면을 교실 큰 화면에 띄웁니다.</p>
    <div class="row">
      <div><label for="pin">잠금 번호</label><input id="pin" type="password" inputmode="numeric" placeholder="••••"></div>
      <div style="flex:0 0 auto"><button class="btn p" id="pg2">열기</button></div>
    </div>
  </div>`));
  const open=()=>{ if(document.getElementById('pin').value.trim()!==TEACH_PIN)return alert('번호가 다릅니다.');
    sessionStorage.setItem('mb_teach','1'); viewTeacherPick(); };
  document.getElementById('pg2').onclick=open;
  document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')open()};
}
function viewTeacherPick(){
  clearView(); showHome(true); crumb('교사 화면');
  const ls=Object.values(LESSONS).filter(L=>L.ready);
  V.append($(`<div class="card">
    <h2>어느 반, 어느 차시를 띄울까요</h2>
    <p class="d">고른 반의 보드가 큰 화면에 뜹니다.</p>
    <label>반</label><div class="pick" id="tc">${CLASSES.map(x=>`<button data-c="${x}">${x}반</button>`).join('')}</div>
    <label style="margin-top:14px">차시</label><div class="pick" id="tl">${ls.map(L=>`<button data-no="${L.no}">${L.no}차시</button>`).join('')}</div>
    <div style="margin-top:16px"><button class="btn p" id="tok" disabled>보드 열기</button></div>
  </div>`));
  let cls=null,no=null; const ok=document.getElementById('tok');
  const sel=(id,b)=>document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  document.querySelectorAll('#tc button').forEach(b=>b.onclick=()=>{cls=+b.dataset.c;sel('tc',b);ok.disabled=!(cls&&no)});
  document.querySelectorAll('#tl button').forEach(b=>b.onclick=()=>{no=+b.dataset.no;sel('tl',b);ok.disabled=!(cls&&no)});
  ok.onclick=()=>viewBoard(cls,no);
}
async function viewBoard(cls,no){
  const L=LESSONS[no];
  clearView(); showHome(true); crumb(cls+'반 · '+no+'차시 '+L.name);
  const s=await initStore(); const R=roomPath(cls,no);
  const joinUrl=location.origin+location.pathname;
  V.append($(`<div class="card"><div class="qr">
      <div id="qrbox"></div>
      <div><div class="mini">학생 접속 주소 — 이 QR 은 계속 씁니다</div>
      <div style="font-weight:700;font-size:17px;margin-top:2px">${esc(joinUrl)}</div>
      <div class="mini" style="margin-top:4px">모둠의 <b>③ 기록이</b>가 찍고 <b>${no}차시</b> → 반 → 모둠 을 누릅니다.</div></div>
    </div></div>`));
  try{new QRCode(document.getElementById('qrbox'),{text:joinUrl,width:124,height:124,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  const tabs=$(`<div class="tabs">${L.stages.map((st,i)=>`<button data-i="${i}">${st.tab}</button>`).join('')}
    <span style="flex:1"></span><button id="rev">정답 보기</button></div>`);
  V.append(tabs);
  const body=$('<div></div>'); V.append(body);
  let stage=0,reveal=false;
  const paint=room=>{
    [...tabs.querySelectorAll('button[data-i]')].forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===stage)));
    tabs.querySelector('#rev').setAttribute('aria-pressed',String(reveal));
    const st=L.stages[stage], gs=(room&&room.groups)||{};
    const rows=GROUPS.map(g=>{
      const d=(gs[g]&&gs[g][st.key])||null;
      const cells=st.fields.map(f=>{
        if(!d||!d[f.k])return '<td class="wait">—</td>';
        const okk=correct(f,d[f.k]);
        return `<td class="v">${esc(d[f.k])}${reveal?(okk?' <span class="ok">✓</span>':' <span class="no">✗</span>'):''}</td>`}).join('');
      const extra=st.extra?`<td class="mini">${esc(st.extra(g))}</td>`:'';
      return `<tr class="${d?'done':''}"><th scope="row">${g}모둠</th>${extra}${cells}<td class="mini">${d&&d.by?esc(d.by):''}</td></tr>`}).join('');
    const head=`<tr><th>모둠</th>${st.extra?'<th>조건</th>':''}${st.fields.map(f=>`<th>${esc(f.lab)}</th>`).join('')}<th>올린 사람</th></tr>`;
    const help=(room&&room.help)||{}, hk=Object.keys(help);
    body.innerHTML=`<div class="card"><h2>${esc(st.title)}</h2><p class="d">${esc(st.lead)}</p>
      <div class="tw"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      ${reveal?`<div class="msg g">${esc(st.concl)}</div>`:''}
      ${hk.length?`<div><div class="mini" style="margin-top:14px">도움 요청</div><div class="help">${hk.map(g=>`<span>${esc(g)}모둠 · ${esc(help[g].msg||'')}</span>`).join('')}</div></div>`:''}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" id="clr">이 단계 지우기</button>
        <button class="btn sm" id="chelp">도움 요청 지우기</button>
        <button class="btn sm" id="back">반·차시 바꾸기</button></div></div>`;
    body.querySelector('#clr').onclick=async()=>{if(!confirm('이 단계에 올라온 값을 모두 지울까요?'))return;
      for(const g of GROUPS) await s.set(R+'/groups/'+g+'/'+st.key,null)};
    body.querySelector('#chelp').onclick=()=>s.set(R+'/help',null);
    body.querySelector('#back').onclick=viewTeacherPick;
  };
  tabs.querySelectorAll('button[data-i]').forEach(b=>b.onclick=async()=>{stage=+b.dataset.i;await s.update(R+'/meta',{stage})});
  tabs.querySelector('#rev').onclick=()=>{reveal=!reveal;paint(lastRoom)};
  let lastRoom=null;
  unsubs.push(s.on(R,room=>{lastRoom=room; if(room&&room.meta&&typeof room.meta.stage==='number')stage=room.meta.stage; paint(room)}));
  if(!(await s.once(R+'/meta'))) await s.set(R+'/meta',{stage:0,created:s.now()});
}

  });
})();
